
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>WebAR จำลองแผลไฟไหม้</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #111;
      touch-action: none;
    }

    a-scene {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .topbar {
      position: fixed;
      z-index: 20;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .status {
      color: white;
      background: rgba(0,0,0,.65);
      padding: 9px 13px;
      border-radius: 20px;
      font-size: 13px;
      pointer-events: auto;
    }

    .panel {
      position: fixed;
      z-index: 20;
      left: 12px;
      right: 12px;
      bottom: 14px;
      padding: 10px;
      border-radius: 16px;
      background: rgba(20,20,20,.82);
      color: white;
      backdrop-filter: blur(8px);
    }

    .row {
      display: flex;
      gap: 7px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 13px;
      color: white;
      background: #444;
      font-size: 13px;
      font-weight: 600;
      min-height: 38px;
      touch-action: manipulation;
    }

    button.active {
      background: #1685e8;
    }

    button.danger {
      background: #b52e35;
    }

    button:disabled {
      opacity: .4;
    }

    .setting {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
    }

    input[type="range"] {
      width: 85px;
    }

    .hint {
      position: fixed;
      z-index: 15;
      top: 58px;
      left: 50%;
      transform: translateX(-50%);
      width: max-content;
      max-width: calc(100% - 30px);
      text-align: center;
      color: white;
      font-size: 12px;
      background: rgba(0,0,0,.55);
      border-radius: 20px;
      padding: 7px 12px;
      pointer-events: none;
    }

    .start-screen {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,.88);
      color: white;
      text-align: center;
      padding: 25px;
    }

    .start-card {
      max-width: 330px;
    }

    .start-card h2 {
      margin-bottom: 10px;
    }

    .start-card p {
      font-size: 14px;
      line-height: 1.6;
      color: #ddd;
    }

    .start-card button {
      background: #1685e8;
      padding: 13px 25px;
      font-size: 15px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-height: 600px) {
      .panel {
        bottom: 5px;
        padding: 7px;
      }

      button {
        min-height: 32px;
        padding: 7px 10px;
      }

      .hint {
        top: 48px;
      }
    }
  </style>
</head>

<body>

  <div class="start-screen" id="startScreen">
    <div class="start-card">
      <h2>จำลองแผลไฟไหม้ 3D</h2>
      <p>
        เปิดกล้องและสแกนโปสเตอร์สำหรับใช้งาน AR<br>
        หมุนโมเดลและทดลองวาดรอยแผลไฟไหม้ได้
      </p>
      <button id="startButton">เริ่มใช้งาน</button>
    </div>
  </div>

  <div class="topbar">
    <div class="status" id="status">รอสแกนโปสเตอร์</div>
    <button id="stopButton">ปิดกล้อง</button>
  </div>

  <div class="hint" id="hint">
    สแกนโปสเตอร์เพื่อแสดงโมเดล
  </div>

  <div class="panel">
    <div class="row">
      <button id="rotateMode" class="active">หมุนโมเดล</button>
      <button id="paintMode">วาดแผล</button>
      <button id="resetView">คืนมุมมอง</button>
    </div>

    <div class="row">
      <button id="zoomIn">＋ ซูม</button>
      <button id="zoomOut">－ ซูม</button>
      <button id="rotateLeft">↶</button>
      <button id="rotateRight">↷</button>
      <button id="clearBurns" class="danger">ลบรอยแผล</button>
    </div>

    <div class="row">
      <label class="setting">
        ขนาดแผล
        <input id="brushSize" type="range"
               min="8" max="90" value="35">
      </label>

      <label class="setting">
        ความเข้ม
        <input id="burnStrength" type="range"
               min="1" max="10" value="5">
      </label>
    </div>
  </div>

  <a-scene
    id="scene"
    mindar-image="imageTargetSrc: ./targets.mind;
                  autoStart: false;
                  uiScanning: yes;
                  uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <a-asset-item
        id="bodyModel"
        src="./base_basic_pbr.glb">
      </a-asset-item>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-entity
        id="modelRoot"
        position="0 0 0"
        rotation="90 0 0"
        scale="0.42 0.42 0.42">

        <a-entity
          id="model"
          gltf-model="#bodyModel">
        </a-entity>

      </a-entity>

    </a-entity>
  </a-scene>

  <script>
  (() => {
    "use strict";

    const sceneEl = document.querySelector("#scene");
    const modelEl = document.querySelector("#model");
    const rootEl = document.querySelector("#modelRoot");

    const statusEl = document.querySelector("#status");
    const hintEl = document.querySelector("#hint");

    const startScreen = document.querySelector("#startScreen");

    const rotateModeBtn = document.querySelector("#rotateMode");
    const paintModeBtn = document.querySelector("#paintMode");

    const brushSizeInput = document.querySelector("#brushSize");
    const burnStrengthInput = document.querySelector("#burnStrength");

    const THREE = AFRAME.THREE;

    let modelLoaded = false;
    let targetVisible = false;
    let cameraStarted = false;
    let paintMode = false;

    let raycaster;
    let pointerNdc;

    let paintMaterials = [];
    let originalMaterials = [];

    let activePointer = null;
    let lastHit = null;
    let heldTimer = null;

    let rotationY = 0;
    let zoom = 0.42;

    let pinchStartDistance = 0;
    let pinchStartZoom = 0;

    const pointers = new Map();

    const clamp = (value, min, max) =>
      Math.max(min, Math.min(max, value));

    function getCanvas() {
      return sceneEl.canvas;
    }

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setMode(isPaint) {
      paintMode = isPaint;

      rotateModeBtn.classList.toggle("active", !isPaint);
      paintModeBtn.classList.toggle("active", isPaint);

      hintEl.textContent = isPaint
        ? "แตะเพื่อสร้างแผล • ลากเพื่อวาดต่อเนื่อง • กดค้างเพื่อเพิ่มความเข้ม"
        : "ลากนิ้วเพื่อหมุน • ใช้สองนิ้วเพื่อซูม";
    }

    // ------------------------------------
    // เตรียม texture สำหรับวาดแผล
    // ------------------------------------

    function preparePaintTextures() {
      if (!modelLoaded) return;

      paintMaterials = [];
      originalMaterials = [];

      const object = modelEl.object3D;

      object.traverse((child) => {
        if (!child.isMesh) return;

        const original = child.material;
        const originals = Array.isArray(original)
          ? original
          : [original];

        const replacements = originals.map((mat) => {
          if (!mat || !mat.map || !mat.map.image) {
            return mat;
          }

          const image = mat.map.image;

          const width = image.naturalWidth || image.width;
          const height = image.naturalHeight || image.height;

          if (!width || !height) return mat;

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d", {
            willReadFrequently: false
          });

          ctx.drawImage(image, 0, 0, width, height);

          const paintMap = new THREE.CanvasTexture(canvas);

          paintMap.wrapS = mat.map.wrapS;
          paintMap.wrapT = mat.map.wrapT;
          paintMap.magFilter = mat.map.magFilter;
          paintMap.minFilter = mat.map.minFilter;
          paintMap.anisotropy = mat.map.anisotropy;
          paintMap.flipY = mat.map.flipY;
          paintMap.colorSpace = mat.map.colorSpace;

          paintMap.offset.copy(mat.map.offset);
          paintMap.repeat.copy(mat.map.repeat);
          paintMap.center.copy(mat.map.center);
          paintMap.rotation = mat.map.rotation;

          paintMap.matrixAutoUpdate = mat.map.matrixAutoUpdate;
          paintMap.matrix.copy(mat.map.matrix);

          paintMap.needsUpdate = true;

          const cloned = mat.clone();
          cloned.map = paintMap;
          cloned.needsUpdate = true;

          const data = {
            canvas,
            ctx,
            texture: paintMap,
            originalMap: mat.map,
            width,
            height
          };

          cloned.userData.burnPaintData = data;

          paintMaterials.push({
            material: cloned,
            data
          });

          return cloned;
        });

        originalMaterials.push({
          mesh: child,
          material: original
        });

        child.material = Array.isArray(original)
          ? replacements
          : replacements[0];
      });

      raycaster = new THREE.Raycaster();
      pointerNdc = new THREE.Vector2();
    }

    // ------------------------------------
    // ค้นหาตำแหน่งที่นิ้วแตะบนโมเดล
    // ------------------------------------

    function getModelHit(clientX, clientY) {
      if (
        !modelLoaded ||
        !raycaster ||
        !sceneEl.camera ||
        !modelEl.object3D
      ) {
        return null;
      }

      const canvas = getCanvas();
      if (!canvas) return null;

      const rect = canvas.getBoundingClientRect();

      if (!rect.width || !rect.height) return null;

      pointerNdc.x =
        ((clientX - rect.left) / rect.width) * 2 - 1;

      pointerNdc.y =
        -((clientY - rect.top) / rect.height) * 2 + 1;

      sceneEl.camera.updateMatrixWorld(true);
      rootEl.object3D.updateMatrixWorld(true);
      modelEl.object3D.updateMatrixWorld(true);

      raycaster.setFromCamera(pointerNdc, sceneEl.camera);

      const hits = raycaster.intersectObject(
        modelEl.object3D,
        true
      );

      // ใช้เฉพาะจุดที่ใกล้กล้องที่สุด
      // ป้องกันการแตะครั้งเดียวแล้วเกิดหลายรอย
      if (!hits.length) return null;

      const hit = hits[0];

      if (!hit.uv || !hit.object || !hit.object.material) {
        return null;
      }

      const material = Array.isArray(hit.object.material)
        ? hit.object.material[hit.face.materialIndex]
        : hit.object.material;

      if (!material || !material.userData) return null;

      const data = material.userData.burnPaintData;

      if (!data) return null;

      const uv = hit.uv.clone();

      data.originalMap.updateMatrix();
      data.originalMap.transformUv(uv);

      return {
        uv: {
          u: uv.x,
          v: uv.y
        },
        data
      };
    }

    // ------------------------------------
    // สร้างรอยไหม้หนึ่งตำแหน่ง
    // ------------------------------------

    function stampBurn(hit, amount = 1) {
      if (!hit || !hit.data) return;

      const data = hit.data;
      const ctx = data.ctx;

      const size = Number(brushSizeInput.value);
      const strength = Number(burnStrengthInput.value) / 10;

      const x = hit.uv.u * data.width;
      const y = (1 - hit.uv.v) * data.height;

      const radius = size * (0.55 + strength * 0.35);

      ctx.save();

      // รอยแดงรอบนอก
      const outer = ctx.createRadialGradient(
        x, y, radius * 0.12,
        x, y, radius
      );

      outer.addColorStop(0, "rgba(70,12,8,0.85)");
      outer.addColorStop(0.35, "rgba(130,25,17,0.75)");
      outer.addColorStop(0.65, "rgba(190,45,35,0.55)");
      outer.addColorStop(1, "rgba(210,65,45,0)");

      ctx.globalCompositeOperation = "multiply";
      ctx.globalAlpha = clamp(amount * strength, 0.05, 1);

      ctx.fillStyle = outer;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      // บริเวณไหม้ตรงกลาง
      const center = ctx.createRadialGradient(
        x, y, 1,
        x, y, radius * 0.55
      );

      center.addColorStop(0, "rgba(35,15,12,0.95)");
      center.addColorStop(0.45, "rgba(75,28,20,0.9)");
      center.addColorStop(0.8, "rgba(120,40,25,0.55)");
      center.addColorStop(1, "rgba(120,40,25,0)");

      ctx.fillStyle = center;
      ctx.beginPath();
      ctx.arc(x, y, radius * 0.6, 0, Math.PI * 2);
      ctx.fill();

      // จุดสีเข้มเล็ก ๆ ภายในรอยเดียวกัน
      // ไม่สุ่มสร้างรอยแผลแยกหลายตำแหน่ง
      const dots = [
        [-0.16, -0.08, 0.10],
        [0.12, 0.13, 0.08],
        [0.04, -0.22, 0.07]
      ];

      ctx.fillStyle = "rgba(28,13,10,0.45)";

      for (const dot of dots) {
        ctx.beginPath();
        ctx.arc(
          x + radius * dot[0],
          y + radius * dot[1],
          radius * dot[2],
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      ctx.restore();

      data.texture.needsUpdate = true;
    }

    // ------------------------------------
    // เพิ่มความเข้มที่รอยเดิม
    // ------------------------------------

    function strengthenSameBurn() {
      if (!lastHit || !paintMode) return;

      // วาดซ้ำที่พิกัดเดิม ไม่สร้างตำแหน่งใหม่
      stampBurn(lastHit, 0.18);
    }

    // ------------------------------------
    // วาดต่อเนื่องเมื่อมีการลากนิ้ว
    // ------------------------------------

    function interpolatePaint(from, to) {
      if (!from || !to || from.data !== to.data) {
        stampBurn(to, 1);
        return;
      }

      const dx = to.uv.u - from.uv.u;
      const dy = to.uv.v - from.uv.v;

      const distance = Math.sqrt(dx * dx + dy * dy);

      const steps = Math.max(
        1,
        Math.ceil(distance * to.data.width / 15)
      );

      // จำกัดจำนวนจุด ป้องกันการกระโดดข้ามโมเดล
      if (steps > 35) {
        stampBurn(to, 1);
        return;
      }

      for (let i = 1; i <= steps; i++) {
        const t = i / steps;

        stampBurn({
          data: to.data,
          uv: {
            u: from.uv.u + dx * t,
            v: from.uv.v + dy * t
          }
        }, 0.65);
      }
    }

    // ------------------------------------
    // การหมุนโมเดล
    // ------------------------------------

    function rotateModel(delta) {
      rotationY += delta;
      rootEl.object3D.rotation.y =
        THREE.MathUtils.degToRad(rotationY);
    }

    function setZoom(value) {
      zoom = clamp(value, 0.18, 0.9);
      rootEl.object3D.scale.setScalar(zoom);
    }

    // ------------------------------------
    // ควบคุมการแตะและลาก
    // ------------------------------------

    function clearHeldTimer() {
      if (heldTimer) {
        clearInterval(heldTimer);
        heldTimer = null;
      }
    }

    function onPointerDown(event) {
      if (!targetVisible || !modelLoaded) return;

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      // สองนิ้ว = ซูมในโหมดหมุน
      if (pointers.size === 2) {
        clearHeldTimer();
        activePointer = null;
        lastHit = null;

        const values = [...pointers.values()];
        pinchStartDistance = Math.hypot(
          values[0].x - values[1].x,
          values[0].y - values[1].y
        );

        pinchStartZoom = zoom;
        return;
      }

      if (pointers.size !== 1) return;

      activePointer = {
        id: event.pointerId,
        x: event.clientX,
        y: event.clientY
      };

      if (paintMode) {
        const hit = getModelHit(
          event.clientX,
          event.clientY
        );

        if (!hit) return;

        // หนึ่ง pointerdown สร้างหนึ่งรอยเท่านั้น
        lastHit = hit;
        stampBurn(hit, 1);

        // กดค้างเพิ่มความเข้มตำแหน่งเดิม
        heldTimer = setInterval(
          strengthenSameBurn,
          300
        );
      }
    }

    function onPointerMove(event) {
      if (!pointers.has(event.pointerId)) return;

      const previous = pointers.get(event.pointerId);

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      // ซูมด้วยสองนิ้ว
      if (pointers.size === 2 && !paintMode) {
        const values = [...pointers.values()];

        const distance = Math.hypot(
          values[0].x - values[1].x,
          values[0].y - values[1].y
        );

        if (pinchStartDistance > 0) {
          setZoom(
            pinchStartZoom * distance / pinchStartDistance
          );
        }

        return;
      }

      if (
        !activePointer ||
        activePointer.id !== event.pointerId
      ) {
        return;
      }

      const dx = event.clientX - previous.x;
      const dy = event.clientY - previous.y;

      if (paintMode) {
        const currentHit = getModelHit(
          event.clientX,
          event.clientY
        );

        if (currentHit) {
          if (lastHit) {
            interpolatePaint(lastHit, currentHit);
          } else {
            stampBurn(currentHit, 1);
          }

          lastHit = currentHit;
        }
      } else {
        rotateModel(dx * 0.6);
      }

      activePointer.x = event.clientX;
      activePointer.y = event.clientY;
    }

    function onPointerUp(event) {
      pointers.delete(event.pointerId);

      if (activePointer &&
          activePointer.id === event.pointerId) {
        activePointer = null;
      }

      clearHeldTimer();
      lastHit = null;

      if (pointers.size < 2) {
        pinchStartDistance = 0;
      }
    }

    function attachPointerEvents() {
      const canvas = getCanvas();
      if (!canvas) return;

      canvas.style.touchAction = "none";

      canvas.addEventListener(
        "pointerdown",
        onPointerDown
      );

      canvas.addEventListener(
        "pointermove",
        onPointerMove
      );

      canvas.addEventListener(
        "pointerup",
        onPointerUp
      );

      canvas.addEventListener(
        "pointercancel",
        onPointerUp
      );

      canvas.addEventListener(
        "lostpointercapture",
        onPointerUp
      );
    }

    // ------------------------------------
    // ลบรอยไหม้ทั้งหมด
    // ------------------------------------

    function clearBurns() {
      for (const item of paintMaterials) {
        const data = item.data;

        data.ctx.clearRect(
          0, 0, data.width, data.height
        );

        const image = data.originalMap.image;

        data.ctx.drawImage(
          image,
          0,
          0,
          data.width,
          data.height
        );

        data.texture.needsUpdate = true;
      }

      setStatus("ลบรอยแผลแล้ว");
    }

    // ------------------------------------
    // ปุ่มควบคุม
    // ------------------------------------

    document.querySelector("#rotateMode")
      .addEventListener("click", () => {
        setMode(false);
      });

    document.querySelector("#paintMode")
      .addEventListener("click", () => {
        setMode(true);
      });

    document.querySelector("#zoomIn")
      .addEventListener("click", () => {
        setZoom(zoom + 0.05);
      });

    document.querySelector("#zoomOut")
      .addEventListener("click", () => {
        setZoom(zoom - 0.05);
      });

    document.querySelector("#rotateLeft")
      .addEventListener("click", () => {
        rotateModel(-10);
      });

    document.querySelector("#rotateRight")
      .addEventListener("click", () => {
        rotateModel(10);
      });

    document.querySelector("#resetView")
      .addEventListener("click", () => {
        rotationY = 0;

        rootEl.object3D.rotation.set(
          THREE.MathUtils.degToRad(90),
          0,
          0
        );

        setZoom(0.42);
        setStatus("คืนมุมมองแล้ว");
      });

    document.querySelector("#clearBurns")
      .addEventListener("click", clearBurns);

    // ------------------------------------
    // เริ่มและหยุดกล้อง
    // ------------------------------------

    async function startCamera() {
      try {
        setStatus("กำลังเปิดกล้อง...");

        const system =
          sceneEl.systems["mindar-image-system"];

        await system.start();

        cameraStarted = true;
        startScreen.classList.add("hidden");

        setStatus("กำลังค้นหาโปสเตอร์");
      } catch (error) {
        console.error(error);

        setStatus("เปิดกล้องไม่สำเร็จ");

        alert(
          "ไม่สามารถเปิดกล้องได้ กรุณาอนุญาตการใช้กล้องและเปิดเว็บผ่าน HTTPS"
        );
      }
    }

    async function stopCamera() {
      try {
        const system =
          sceneEl.systems["mindar-image-system"];

        if (system && cameraStarted) {
          await system.stop();
        }
      } catch (error) {
        console.error(error);
      }

      cameraStarted = false;
      targetVisible = false;

      startScreen.classList.remove("hidden");
      setStatus("ปิดกล้องแล้ว");
    }

    document.querySelector("#startButton")
      .addEventListener("click", startCamera);

    document.querySelector("#stopButton")
      .addEventListener("click", stopCamera);

    // ------------------------------------
    // โหลดโมเดล
    // ------------------------------------

    modelEl.addEventListener("model-loaded", () => {
      modelLoaded = true;

      preparePaintTextures();

      setStatus("โมเดลพร้อมใช้งาน");

      attachPointerEvents();
    });

    modelEl.addEventListener("model-error", (event) => {
      console.error("Model error:", event);

      setStatus("โหลดโมเดลไม่สำเร็จ");
    });

    // ------------------------------------
    // ตรวจจับโปสเตอร์
    // ------------------------------------

    const targetEl =
      document.querySelector("[mindar-image-target]");

    targetEl.addEventListener("targetFound", () => {
      targetVisible = true;

      setStatus("พบโปสเตอร์แล้ว");
      hintEl.textContent = "เลือกโหมดหมุนหรือวาดแผล";
    });

    targetEl.addEventListener("targetLost", () => {
      targetVisible = false;

      clearHeldTimer();
      activePointer = null;
      lastHit = null;
      pointers.clear();

      setStatus("ไม่พบโปสเตอร์");
      hintEl.textContent = "สแกนโปสเตอร์เพื่อแสดงโมเดล";
    });

    // เริ่มต้น
    setMode(false);

  })();
  </script>

</body>
</html>
