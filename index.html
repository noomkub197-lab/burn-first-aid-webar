
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WebAR จำลองแผลไฟไหม้</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: system-ui, sans-serif;
  color: white;
  touch-action: none;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1;
  background: transparent !important;
}

a-scene canvas {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: transparent !important;
  touch-action: none !important;
}

video {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  z-index: 0 !important;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(145deg,#10243a,#1b3953);
  text-align: center;
}

.panel {
  width: 100%;
  max-width: 440px;
  padding: 25px;
  border: 1px solid #ffffff35;
  border-radius: 20px;
  background: #ffffff12;
}

h2 { margin-top: 0; }

button {
  color: white;
  background: #18334e;
  border: 1px solid #ffffff55;
  border-radius: 12px;
  padding: 10px 13px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active { background: #dc3e36; }
button:disabled { opacity: .5; }

#startBtn {
  width: 100%;
  background: #dc3e36;
  margin-top: 10px;
  padding: 13px;
}

#status {
  font-size: 13px;
  line-height: 1.6;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

#hint {
  display: none;
  position: fixed;
  z-index: 10;
  top: 10px;
  left: 10px;
  right: 10px;
  padding: 10px;
  text-align: center;
  border-radius: 12px;
  background: #14283bea;
  font-size: 13px;
  pointer-events: none;
}

#modelStatus {
  display: none;
  position: fixed;
  z-index: 10;
  top: 53px;
  left: 10px;
  right: 10px;
  text-align: center;
  font-size: 12px;
  pointer-events: none;
}

#controls {
  display: none;
  position: fixed;
  z-index: 20;
  bottom: 8px;
  left: 0;
  right: 0;
  padding: 7px;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  max-height: 57vh;
  overflow-y: auto;
}

.control-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  pointer-events: auto;
  flex-wrap: wrap;
}

.control-row button {
  min-width: 43px;
  min-height: 39px;
  background: #142b43ed;
  box-shadow: 0 2px 8px #0005;
}

.control-row .wide { min-width: 100px; }

#controls button { touch-action: manipulation; }

#zoomValue {
  font-size: 12px;
  background: #14283bea;
  border-radius: 10px;
  padding: 7px 10px;
}

#paintSettings {
  display: none;
  width: min(94%, 420px);
  padding: 9px 12px;
  border-radius: 12px;
  background: #14283bea;
  font-size: 12px;
  pointer-events: auto;
}

.setting {
  display: grid;
  grid-template-columns: 85px 1fr 35px;
  gap: 8px;
  align-items: center;
  margin: 5px 0;
}

.setting input { width: 100%; }

.mode-active {
  background: #dc3e36 !important;
  border-color: white !important;
}

#modeLabel {
  font-size: 12px;
  background: #14283bea;
  border-radius: 10px;
  padding: 6px 10px;
}

@media (max-height: 650px) {
  #controls { gap: 4px; }
  .control-row button {
    min-height: 34px;
    padding: 7px 10px;
  }
  #paintSettings { padding: 5px 10px; }
}
</style>
</head>

<body>

<div id="start">
  <div class="panel">
    <h2>WebAR จำลองแผลไฟไหม้</h2>
    <p>
      สแกนโปสเตอร์เพื่อแสดงโมเดล 3 มิติ<br>
      หมุนโมเดล ซูม และทดลองระบายแผลไหม้ได้
    </p>
    <button id="startBtn">เริ่มสแกนโปสเตอร์</button>
    <div id="status">กดเริ่มสแกนและอนุญาตให้ใช้กล้อง</div>
  </div>
</div>

<div id="hint">ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล</div>
<div id="modelStatus">กำลังโหลดโมเดล 3 มิติ...</div>

<div id="controls">

  <div class="control-row">
    <button id="rotateModeBtn" class="mode-active">โหมดหมุน</button>
    <button id="paintModeBtn">โหมดระบายแผล</button>
    <span id="modeLabel">ลากเพื่อหมุนโมเดล</span>
  </div>

  <div class="control-row" id="rotateControls">
    <button data-action="up">▲</button>
    <button data-action="left">◀</button>
    <button data-action="down">▼</button>
    <button data-action="right">▶</button>
    <button data-action="tiltLeft">↶</button>
    <button data-action="tiltRight">↷</button>
  </div>

  <div class="control-row" id="zoomControls">
    <button data-action="zoomOut">− ซูม</button>
    <span id="zoomValue">100%</span>
    <button data-action="zoomIn">+ ซูม</button>
  </div>

  <div id="paintSettings">
    <div class="setting">
      <label for="brushSize">ขนาดแปรง</label>
      <input id="brushSize" type="range" min="5" max="100" value="35">
      <span id="brushSizeValue">35</span>
    </div>
    <div class="setting">
      <label for="burnIntensity">ความเข้ม</label>
      <input id="burnIntensity" type="range" min="10" max="100" value="65">
      <span id="burnIntensityValue">65%</span>
    </div>
  </div>

  <div class="control-row" id="paintControls" style="display:none">
    <button id="clearBurnsBtn">ล้างรอยแผลทั้งหมด</button>
  </div>

  <div class="control-row">
    <button class="wide" id="resetBtn">รีเซ็ตมุมมอง</button>
    <button class="wide" id="stopBtn">ปิดกล้อง</button>
  </div>

</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes;"
  color-space="sRGB"
  embedded
  renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true; antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="60000">
    <a-asset-item id="burnModel" src="./base_basic_pbr.glb"></a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="posterTarget"
    mindar-image-target="targetIndex: 0">

    <a-entity
      id="modelRoot"
      position="0 0.05 0.05"
      rotation="0 0 0"
      scale="0.42 0.42 0.42">

      <a-entity
        id="modelMesh"
        gltf-model="#burnModel"
        position="0 -0.217 0"
        rotation="90 0 0">
      </a-entity>

    </a-entity>
  </a-entity>
</a-scene>

<script>
(() => {
  const scene = document.querySelector("a-scene");
  const target = document.getElementById("posterTarget");
  const root = document.getElementById("modelRoot");
  const mesh = document.getElementById("modelMesh");

  const startLayer = document.getElementById("start");
  const startBtn = document.getElementById("startBtn");
  const status = document.getElementById("status");
  const hint = document.getElementById("hint");
  const modelStatus = document.getElementById("modelStatus");
  const controls = document.getElementById("controls");
  const zoomValue = document.getElementById("zoomValue");

  const rotateModeBtn = document.getElementById("rotateModeBtn");
  const paintModeBtn = document.getElementById("paintModeBtn");
  const rotateControls = document.getElementById("rotateControls");
  const zoomControls = document.getElementById("zoomControls");
  const paintControls = document.getElementById("paintControls");
  const paintSettings = document.getElementById("paintSettings");
  const modeLabel = document.getElementById("modeLabel");

  const brushSizeInput = document.getElementById("brushSize");
  const intensityInput = document.getElementById("burnIntensity");
  const brushSizeValue = document.getElementById("brushSizeValue");
  const intensityValue = document.getElementById("burnIntensityValue");

  let cameraStarted = false;
  let targetFound = false;
  let modelLoaded = false;
  let currentMode = "rotate";

  let rotX = 0;
  let rotY = 0;
  let rotZ = 0;

  const BASE_ZOOM = 0.42;
  let zoom = BASE_ZOOM;
  const MIN_ZOOM = 0.15;
  const MAX_ZOOM = 1.30;
  const ROTATE_SPEED = 0.7;

  const pointers = new Map();
  let previousX = 0;
  let previousY = 0;
  let previousDistance = 0;

  let raycaster = null;
  let camera = null;
  let paintMaterials = [];
  let modelObject = null;
  let paintingPointer = null;
  let lastPaintPoint = null;
  let paintHoldTimer = null;
  let holdBoost = 1;

  function updateModel() {
    root.setAttribute("rotation", `${rotX} ${rotY} ${rotZ}`);
    root.setAttribute("scale", `${zoom} ${zoom} ${zoom}`);
    zoomValue.textContent = Math.round((zoom / BASE_ZOOM) * 100) + "%";
  }

  function resetModel() {
    rotX = 0;
    rotY = 0;
    rotZ = 0;
    zoom = BASE_ZOOM;
    updateModel();
  }

  function waitForScene() {
    return new Promise(resolve => {
      if (scene.hasLoaded) resolve();
      else scene.addEventListener("loaded", resolve, { once: true });
    });
  }

  function waitForVideo(timeout = 15000) {
    return new Promise((resolve, reject) => {
      const startTime = Date.now();

      function check() {
        const videos = [...document.querySelectorAll("video")];

        const active = videos.find(v =>
          v.videoWidth > 0 &&
          v.videoHeight > 0 &&
          v.readyState >= 2
        );

        if (active) return resolve(active);

        if (Date.now() - startTime > timeout) {
          return reject(new Error("ยังไม่ได้รับภาพจากกล้อง"));
        }

        requestAnimationFrame(check);
      }

      check();
    });
  }

  function showError(message) {
    status.textContent = message;
    startLayer.style.display = "grid";
    startBtn.disabled = false;
  }

  mesh.addEventListener("model-loaded", () => {
    modelLoaded = true;
    modelObject = mesh.getObject3D("mesh");

    modelStatus.textContent = "โมเดล 3 มิติพร้อมใช้งาน";

    preparePaintTextures();
    setupRaycaster();

    console.log("GLB loaded");
  });

  mesh.addEventListener("model-error", event => {
    console.error("GLB error", event);
    modelStatus.textContent = "โหลดโมเดลไม่สำเร็จ ตรวจสอบไฟล์ GLB";
  });

  target.addEventListener("targetFound", () => {
    targetFound = true;
    hint.textContent = "เลือกโหมดหมุนหรือโหมดระบายแผล";
    controls.style.display = "flex";
    modelStatus.style.display = "block";
  });

  target.addEventListener("targetLost", () => {
    targetFound = false;
    pointers.clear();
    paintingPointer = null;
    clearHoldTimer();
    controls.style.display = "none";
    modelStatus.style.display = "none";
    hint.textContent = "ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล";
  });

  scene.addEventListener("arReady", () => {
    status.textContent = "กล้องพร้อมแล้ว กำลังค้นหาโปสเตอร์...";
  });

  scene.addEventListener("arError", event => {
    console.error("AR error", event);
    showError("ระบบ AR เกิดข้อผิดพลาด กรุณาลองใหม่");
  });

  startBtn.addEventListener("click", async () => {
    if (cameraStarted) return;

    startBtn.disabled = true;
    status.textContent = "กำลังเปิดกล้อง...";

    try {
      if (!window.isSecureContext) {
        throw new Error("ต้องเปิดเว็บไซต์ผ่าน HTTPS");
      }

      await waitForScene();

      const mindar = scene.systems["mindar-image-system"];

      if (!mindar) {
        throw new Error("ไม่พบระบบ MindAR");
      }

      await mindar.start();
      await waitForVideo();

      cameraStarted = true;
      startLayer.style.display = "none";
      hint.style.display = "block";

    } catch (error) {
      console.error(error);

      try {
        const mindar = scene.systems["mindar-image-system"];
        if (mindar) await mindar.stop();
      } catch (e) {
        console.error(e);
      }

      cameraStarted = false;
      showError("เปิดกล้องไม่สำเร็จ: " + error.message);

    } finally {
      startBtn.disabled = false;
    }
  });

  // ------------------------------
  // เตรียม Texture สำหรับระบายแผล
  // ------------------------------

  function preparePaintTextures() {
    if (!modelObject || !window.THREE) return;

    paintMaterials = [];

    modelObject.traverse(object => {
      if (!object.isMesh || !object.material) return;

      const originalMaterials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      const newMaterials = originalMaterials.map(material => {
        const cloned = material.clone();

        if (!material.map || !material.map.image) {
          return cloned;
        }

        const sourceImage = material.map.image;

        const canvas = document.createElement("canvas");
        canvas.width = sourceImage.width || sourceImage.videoWidth || 1024;
        canvas.height = sourceImage.height || sourceImage.videoHeight || 1024;

        const ctx = canvas.getContext("2d", {
          willReadFrequently: false
        });

        try {
          ctx.drawImage(sourceImage, 0, 0, canvas.width, canvas.height);
        } catch (error) {
          console.warn("ไม่สามารถคัดลอก texture ต้นฉบับ", error);
          return cloned;
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.flipY = true;
        texture.colorSpace = material.map.colorSpace;
        texture.wrapS = material.map.wrapS;
        texture.wrapT = material.map.wrapT;
        texture.magFilter = material.map.magFilter;
        texture.minFilter = material.map.minFilter;
        texture.generateMipmaps = material.map.generateMipmaps;

        if (material.map.transformUv) {
          texture.offset.copy(material.map.offset);
          texture.repeat.copy(material.map.repeat);
          texture.center.copy(material.map.center);
          texture.rotation = material.map.rotation;
        }

        cloned.map = texture;
        cloned.needsUpdate = true;

        paintMaterials.push({
          canvas,
          ctx,
          texture,
          material: cloned
        });

        return cloned;
      });

      object.material = Array.isArray(object.material)
        ? newMaterials
        : newMaterials[0];
    });

    console.log("Paint textures:", paintMaterials.length);
  }

  function setupRaycaster() {
    if (!window.THREE) return;

    const threeScene = scene.object3D;
    const cameraEl = scene.camera;

    if (!cameraEl) {
      setTimeout(setupRaycaster, 300);
      return;
    }

    camera = cameraEl;
    raycaster = new THREE.Raycaster();
  }

  // ------------------------------
  // คำนวณตำแหน่งสัมผัสโมเดล
  // ------------------------------

  function getModelHit(clientX, clientY) {
    if (!raycaster || !camera || !modelObject || !targetFound) {
      return null;
    }

    const canvas = scene.canvas;
    if (!canvas) return null;

    const rect = canvas.getBoundingClientRect();

    const pointer = new THREE.Vector2(
      ((clientX - rect.left) / rect.width) * 2 - 1,
      -((clientY - rect.top) / rect.height) * 2 + 1
    );

    raycaster.setFromCamera(pointer, camera);

    const hits = raycaster.intersectObject(modelObject, true);

    if (!hits.length) return null;

    for (const hit of hits) {
      if (!hit.uv || !hit.object || !hit.object.material) continue;

      const material = Array.isArray(hit.object.material)
        ? hit.object.material[hit.face.materialIndex]
        : hit.object.material;

      if (!material || !material.map) continue;

      const paintData = paintMaterials.find(
        item => item.material === material
      );

      if (!paintData) continue;

      const uv = hit.uv.clone();

      if (material.map.transformUv) {
        material.map.transformUv(uv);
      }

      const x = uv.x * paintData.canvas.width;
      const y = (1 - uv.y) * paintData.canvas.height;

      return {
        x,
        y,
        data: paintData,
        point: hit.point
      };
    }

    return null;
  }

  // ------------------------------
  // วาดรอยแผลไหม้
  // ------------------------------

  function drawBurn(hit, strength = 1) {
    if (!hit || !hit.data) return;

    const { ctx, canvas, texture } = hit.data;

    const brush = Number(brushSizeInput.value);
    const intensity = Number(intensityInput.value) / 100;

    const size = Math.max(
      3,
      (brush / 100) * Math.min(canvas.width, canvas.height) * 0.12
    );

    const power = Math.min(1, intensity * strength * holdBoost);

    const x = hit.x;
    const y = hit.y;

    ctx.save();

    // ขอบแดงอักเสบ
    const outer = ctx.createRadialGradient(
      x, y, size * 0.08,
      x, y, size
    );

    outer.addColorStop(0, `rgba(95,12,8,${0.80 * power})`);
    outer.addColorStop(0.35, `rgba(150,35,20,${0.75 * power})`);
    outer.addColorStop(0.68, `rgba(190,55,35,${0.55 * power})`);
    outer.addColorStop(1, "rgba(180,35,25,0)");

    ctx.fillStyle = outer;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();

    // เนื้อแผลสีน้ำตาลแดง
    const middle = ctx.createRadialGradient(
      x - size * 0.12,
      y - size * 0.12,
      size * 0.03,
      x, y,
      size * 0.68
    );

    middle.addColorStop(0, `rgba(65,25,15,${0.80 * power})`);
    middle.addColorStop(0.45, `rgba(105,42,25,${0.80 * power})`);
    middle.addColorStop(0.8, `rgba(135,48,27,${0.50 * power})`);
    middle.addColorStop(1, "rgba(100,30,15,0)");

    ctx.fillStyle = middle;
    ctx.beginPath();
    ctx.arc(x, y, size * 0.72, 0, Math.PI * 2);
    ctx.fill();

    // จุดสีเข้มจำลองสะเก็ดแผล
    const flecks = 5 + Math.round(power * 9);

    for (let i = 0; i < flecks; i++) {
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * size * 0.58;
      const fx = x + Math.cos(angle) * distance;
      const fy = y + Math.sin(angle) * distance;
      const radius = size * (0.025 + Math.random() * 0.065);

      ctx.fillStyle = `rgba(35,15,10,${0.35 + power * 0.55})`;
      ctx.beginPath();
      ctx.arc(fx, fy, radius, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    texture.needsUpdate = true;
  }

  function paintAt(clientX, clientY, strength = 1) {
    const hit = getModelHit(clientX, clientY);
    if (!hit) return;

    if (lastPaintPoint && lastPaintPoint.data === hit.data) {
      const dx = hit.x - lastPaintPoint.x;
      const dy = hit.y - lastPaintPoint.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      const spacing = Math.max(2, Number(brushSizeInput.value) * 0.12);
      const steps = Math.min(30, Math.ceil(distance / spacing));

      for (let i = 1; i < steps; i++) {
        const t = i / steps;

        drawBurn({
          x: lastPaintPoint.x + dx * t,
          y: lastPaintPoint.y + dy * t,
          data: hit.data
        }, strength);
      }
    }

    drawBurn(hit, strength);
    lastPaintPoint = {
      x: hit.x,
      y: hit.y,
      data: hit.data
    };
  }

  function clearBurns() {
    paintMaterials.forEach(item => {
      const image = item.material.map && item.material.map.image;
      const originalMaterial = item.material;

      // คืนค่าภาพต้นฉบับจาก texture ที่เก็บไว้
      if (item.originalImage) {
        item.ctx.clearRect(0, 0, item.canvas.width, item.canvas.height);
        item.ctx.drawImage(
          item.originalImage,
          0, 0,
          item.canvas.width,
          item.canvas.height
        );
      } else if (item.backupCanvas) {
        item.ctx.clearRect(0, 0, item.canvas.width, item.canvas.height);
        item.ctx.drawImage(
          item.backupCanvas,
          0, 0,
          item.canvas.width,
          item.canvas.height
        );
      }

      item.texture.needsUpdate = true;
    });

    lastPaintPoint = null;
  }

  // ------------------------------
  // เก็บภาพต้นฉบับไว้สำหรับล้างแผล
  // ------------------------------

  function saveOriginalTextures() {
    paintMaterials.forEach(item => {
      if (item.backupCanvas) return;

      const backup = document.createElement("canvas");
      backup.width = item.canvas.width;
      backup.height = item.canvas.height;

      backup.getContext("2d").drawImage(item.canvas, 0, 0);

      item.backupCanvas = backup;
    });
  }

  // ------------------------------
  // เลือกโหมด
  // ------------------------------

  function setMode(mode) {
    currentMode = mode;
    pointers.clear();
    lastPaintPoint = null;
    paintingPointer = null;
    clearHoldTimer();

    if (mode === "rotate") {
      rotateModeBtn.classList.add("mode-active");
      paintModeBtn.classList.remove("mode-active");

      rotateControls.style.display = "flex";
      zoomControls.style.display = "flex";
      paintControls.style.display = "none";
      paintSettings.style.display = "none";

      modeLabel.textContent = "ลากเพื่อหมุนโมเดล";
      hint.textContent = "ลากเพื่อหมุนโมเดล ใช้สองนิ้วเพื่อซูม";
    } else {
      paintModeBtn.classList.add("mode-active");
      rotateModeBtn.classList.remove("mode-active");

      rotateControls.style.display = "none";
      zoomControls.style.display = "none";
      paintControls.style.display = "flex";
      paintSettings.style.display = "block";

      modeLabel.textContent = "แตะหรือลากบนโมเดลเพื่อระบายแผล";
      hint.textContent = "แตะหรือลากบนตัวโมเดลเพื่อระบายแผล";
    }
  }

  rotateModeBtn.addEventListener("click", () => setMode("rotate"));
  paintModeBtn.addEventListener("click", () => setMode("paint"));

  // ------------------------------
  // ควบคุมการสัมผัสหน้าจอ
  // ------------------------------

  function getDistance() {
    const p = [...pointers.values()];
    if (p.length < 2) return 0;

    const dx = p[0].x - p[1].x;
    const dy = p[0].y - p[1].y;

    return Math.sqrt(dx * dx + dy * dy);
  }

  function clearHoldTimer() {
    if (paintHoldTimer) {
      clearTimeout(paintHoldTimer);
      paintHoldTimer = null;
    }

    holdBoost = 1;
  }

  document.addEventListener("pointerdown", event => {
    if (!targetFound) return;
    if (event.target.closest("#controls")) return;
    if (event.target.closest("#start")) return;
    if (event.pointerType === "mouse" && event.button !== 0) return;

    if (currentMode === "paint") {
      paintingPointer = event.pointerId;
      lastPaintPoint = null;
      paintAt(event.clientX, event.clientY);

      clearHoldTimer();
      paintHoldTimer = setTimeout(() => {
        holdBoost = 1.8;
        paintAt(event.clientX, event.clientY, 1.3);
      }, 550);

      return;
    }

    pointers.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });

    if (pointers.size === 1) {
      previousX = event.clientX;
      previousY = event.clientY;
    }

    if (pointers.size === 2) {
      previousDistance = getDistance();
    }
  }, true);

  document.addEventListener("pointermove", event => {
    if (!targetFound) return;

    if (currentMode === "paint") {
      if (paintingPointer !== event.pointerId) return;

      event.preventDefault();
      paintAt(event.clientX, event.clientY);
      return;
    }

    if (!pointers.has(event.pointerId)) return;

    event.preventDefault();

    pointers.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });

    if (pointers.size >= 2) {
      const newDistance = getDistance();

      if (previousDistance > 0 && newDistance > 0) {
        const difference = newDistance - previousDistance;
        zoom += difference * 0.002;
        zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));
        updateModel();
      }

      previousDistance = newDistance;
      return;
    }

    const dx = event.clientX - previousX;
    const dy = event.clientY - previousY;

    previousX = event.clientX;
    previousY = event.clientY;

    rotY += dx * ROTATE_SPEED;
    rotX -= dy * ROTATE_SPEED;

    updateModel();
  }, { capture: true, passive: false });

  function releasePointer(event) {
    pointers.delete(event.pointerId);

    if (paintingPointer === event.pointerId) {
      paintingPointer = null;
      lastPaintPoint = null;
      clearHoldTimer();
    }

    if (pointers.size === 1) {
      const p = [...pointers.values()][0];
      previousX = p.x;
      previousY = p.y;
    }

    previousDistance = pointers.size >= 2 ? getDistance() : 0;
  }

  document.addEventListener("pointerup", releasePointer, true);
  document.addEventListener("pointercancel", releasePointer, true);

  // ------------------------------
  // ปุ่มหมุนและซูม
  // ------------------------------

  document.querySelectorAll("[data-action]").forEach(button => {
    button.addEventListener("click", () => {
      if (!targetFound || currentMode !== "rotate") return;

      const action = button.dataset.action;
      const step = 15;

      switch (action) {
        case "left": rotY -= step; break;
        case "right": rotY += step; break;
        case "up": rotX -= step; break;
        case "down": rotX += step; break;
        case "tiltLeft": rotZ -= step; break;
        case "tiltRight": rotZ += step; break;
        case "zoomIn":
          zoom = Math.min(MAX_ZOOM, zoom + 0.05);
          break;
        case "zoomOut":
          zoom = Math.max(MIN_ZOOM, zoom - 0.05);
          break;
      }

      updateModel();
    });
  });

  document.addEventListener("wheel", event => {
    if (!targetFound || currentMode !== "rotate") return;
    if (event.target.closest("#controls")) return;

    event.preventDefault();

    zoom -= event.deltaY * 0.001;
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));

    updateModel();
  }, { passive: false });

  // ------------------------------
  // ปรับแปรง
  // ------------------------------

  brushSizeInput.addEventListener("input", () => {
    brushSizeValue.textContent = brushSizeInput.value;
  });

  intensityInput.addEventListener("input", () => {
    intensityValue.textContent = intensityInput.value + "%";
  });

  document.getElementById("clearBurnsBtn").addEventListener("click", () => {
    clearBurns();
  });

  document.getElementById("resetBtn").addEventListener("click", resetModel);

  // ------------------------------
  // ปิดกล้อง
  // ------------------------------

  document.getElementById("stopBtn").addEventListener("click", async () => {
    try {
      const mindar = scene.systems["mindar-image-system"];

      if (mindar && cameraStarted) {
        await mindar.stop();
      }
    } catch (error) {
      console.error(error);
    }

    cameraStarted = false;
    targetFound = false;
    pointers.clear();
    paintingPointer = null;
    clearHoldTimer();

    resetModel();
    setMode("rotate");

    controls.style.display = "none";
    hint.style.display = "none";
    modelStatus.style.display = "none";
    startLayer.style.display = "grid";

    status.textContent = "ปิดกล้องแล้ว กดเริ่มสแกนเพื่อใช้งานอีกครั้ง";
  });

  // ------------------------------
  // เริ่มต้น
  // ------------------------------

  updateModel();

  // บันทึกภาพต้นฉบับเมื่อเตรียม Texture เสร็จ
  const originalPrepare = preparePaintTextures;

  // เรียกเก็บภาพต้นฉบับหลังโมเดลโหลด
  mesh.addEventListener("model-loaded", () => {
    setTimeout(saveOriginalTextures, 500);
  });

})();
</script>
