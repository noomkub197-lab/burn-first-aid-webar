<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WebAR ปฐมพยาบาลแผลไฟไหม้</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: system-ui, sans-serif;
  touch-action: pan-x pan-y;
  color: white;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1;
  background: transparent !important;
}

a-scene canvas {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: transparent !important;
  touch-action: none !important;
  pointer-events: auto !important;
}

video {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  z-index: 0 !important;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(145deg,#10243a,#1b3953);
  text-align: center;
}

.panel {
  width: 100%;
  max-width: 440px;
  padding: 25px;
  border: 1px solid #ffffff35;
  border-radius: 20px;
  background: #ffffff12;
}

h2 { margin-top: 0; }

button {
  color: white;
  background: #18334e;
  border: 1px solid #ffffff55;
  border-radius: 12px;
  padding: 11px 15px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active { background: #dc3e36; }
button:disabled { opacity: .5; }

#startBtn {
  width: 100%;
  background: #dc3e36;
  margin-top: 10px;
}

#status {
  font-size: 13px;
  line-height: 1.6;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

#hint {
  display: none;
  position: fixed;
  z-index: 10;
  top: 10px;
  left: 10px;
  right: 10px;
  padding: 9px;
  text-align: center;
  border-radius: 12px;
  background: #14283bea;
  font-size: 12px;
  pointer-events: none;
}

#modelStatus {
  display: none;
  position: fixed;
  z-index: 10;
  top: 49px;
  left: 10px;
  right: 10px;
  text-align: center;
  font-size: 11px;
  pointer-events: none;
  text-shadow: 0 1px 3px #000;
}

#controls {
  display: none;
  position: fixed;
  z-index: 20;
  bottom: 8px;
  left: 0;
  right: 0;
  padding: 6px;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
}

.control-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  pointer-events: auto;
  flex-wrap: wrap;
}

.control-row button {
  min-width: 43px;
  min-height: 39px;
  padding: 8px 11px;
  background: #142b43ed;
  box-shadow: 0 2px 8px #0005;
}

.control-row .wide { min-width: 104px; }

#zoomValue, #brushValue {
  font-size: 11px;
  background: #14283bea;
  border-radius: 10px;
  padding: 7px 9px;
}

#paintPanel {
  display: none;
  width: min(94vw, 430px);
  padding: 8px 10px;
  border-radius: 13px;
  background: #14283bed;
  pointer-events: auto;
  box-shadow: 0 2px 10px #0006;
}

#paintPanel .setting {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  margin: 4px 0;
}

#paintPanel input[type="range"] {
  flex: 1;
  min-width: 80px;
  accent-color: #ff765d;
}

#paintPanel .paint-actions {
  display: flex;
  justify-content: center;
  gap: 7px;
  margin-top: 6px;
}

#paintPanel button {
  min-height: 34px;
  padding: 7px 11px;
}

#modeRotate.active { background: #147d9c; }
#modePaint.active { background: #b83d32; }
#clearBurns { background: #8e2929; }
#modelStatus.error { color: #ffb5a9; }
</style>
</head>

<body>

<div id="start">
  <div class="panel">
    <h2>WebAR ปฐมพยาบาลแผลไฟไหม้</h2>
    <p>
      สแกนโปสเตอร์เพื่อแสดงโมเดล 3 มิติ<br>
      หมุน ซูม และทดลองสร้างรอยไหม้บนโมเดลได้
    </p>
    <button id="startBtn">เริ่มสแกนโปสเตอร์</button>
    <div id="status">กดเริ่มสแกนและอนุญาตให้ใช้กล้อง</div>
  </div>
</div>

<div id="hint">ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล</div>
<div id="modelStatus">กำลังโหลดโมเดล 3 มิติ...</div>

<div id="controls">

  <div class="control-row">
    <button id="modeRotate" class="active">↔ หมุนโมเดล</button>
    <button id="modePaint">🔥 วาดรอยไหม้</button>
  </div>

  <div id="paintPanel">
    <div class="setting">
      <label for="brushSize">ขนาดรอยไหม้</label>
      <input id="brushSize" type="range" min="8" max="110" value="38">
      <span id="brushValue">38</span>
    </div>

    <div class="setting">
      <label for="burnSpeed">ความเร็ว/ความเข้ม</label>
      <input id="burnSpeed" type="range" min="1" max="10" value="5">
      <span id="speedValue">5</span>
    </div>

    <div class="paint-actions">
      <button id="clearBurns">ลบรอยไหม้ทั้งหมด</button>
    </div>
  </div>

  <div class="control-row">
    <button data-action="up">▲</button>
  </div>

  <div class="control-row">
    <button data-action="left">◀</button>
    <button data-action="down">▼</button>
    <button data-action="right">▶</button>
  </div>

  <div class="control-row">
    <button data-action="tiltLeft">↶ เอียง</button>
    <button data-action="tiltRight">เอียง ↷</button>
  </div>

  <div class="control-row">
    <button data-action="zoomOut">− ซูม</button>
    <span id="zoomValue">100%</span>
    <button data-action="zoomIn">+ ซูม</button>
  </div>

  <div class="control-row">
    <button class="wide" id="resetBtn">รีเซ็ตมุมมอง</button>
    <button class="wide" id="stopBtn">ปิดกล้อง</button>
  </div>

</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes;"
  color-space="sRGB"
  embedded
  renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true; antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="60000">
    <a-asset-item
      id="burnModel"
      src="./base_basic_pbr.glb">
    </a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="posterTarget"
    mindar-image-target="targetIndex: 0">

    <a-entity
      id="modelRoot"
      position="0 0.05 0.05"
      rotation="0 0 0"
      scale="0.42 0.42 0.42">

      <a-entity
        id="modelMesh"
        gltf-model="#burnModel"
        position="0 -0.217 0"
        rotation="90 0 0">
      </a-entity>

    </a-entity>
  </a-entity>
</a-scene>

<script>
(() => {

  const scene = document.querySelector("a-scene");
  const target = document.getElementById("posterTarget");
  const root = document.getElementById("modelRoot");
  const mesh = document.getElementById("modelMesh");

  const startLayer = document.getElementById("start");
  const startBtn = document.getElementById("startBtn");
  const status = document.getElementById("status");
  const hint = document.getElementById("hint");
  const modelStatus = document.getElementById("modelStatus");
  const controls = document.getElementById("controls");
  const zoomValue = document.getElementById("zoomValue");

  const modeRotate = document.getElementById("modeRotate");
  const modePaint = document.getElementById("modePaint");
  const paintPanel = document.getElementById("paintPanel");

  const brushSizeInput = document.getElementById("brushSize");
  const brushValue = document.getElementById("brushValue");
  const burnSpeedInput = document.getElementById("burnSpeed");
  const speedValue = document.getElementById("speedValue");

  let cameraStarted = false;
  let targetFound = false;
  let modelLoaded = false;
  let interactionMode = "rotate";

  let rotX = 0;
  let rotY = 0;
  let rotZ = 0;

  const BASE_ZOOM = 0.42;
  let zoom = BASE_ZOOM;

  const MIN_ZOOM = 0.15;
  const MAX_ZOOM = 1.30;

  const ROTATE_SPEED = 0.7;

  const pointers = new Map();

  let previousX = 0;
  let previousY = 0;
  let previousDistance = 0;

  let paintMaterials = [];
  let activePaint = null;
  let paintAnimation = 0;

  function updateModel() {
    root.setAttribute("rotation", `${rotX} ${rotY} ${rotZ}`);
    root.setAttribute("scale", `${zoom} ${zoom} ${zoom}`);

    zoomValue.textContent =
      Math.round((zoom / BASE_ZOOM) * 100) + "%";
  }

  function resetModel() {
    rotX = 0;
    rotY = 0;
    rotZ = 0;
    zoom = BASE_ZOOM;
    updateModel();
  }

  function waitForScene() {
    return new Promise(resolve => {
      if (scene.hasLoaded) {
        resolve();
      } else {
        scene.addEventListener("loaded", resolve, { once: true });
      }
    });
  }

  function setMode(mode) {
    interactionMode = mode;

    modeRotate.classList.toggle("active", mode === "rotate");
    modePaint.classList.toggle("active", mode === "paint");

    paintPanel.style.display =
      mode === "paint" ? "block" : "none";

    hint.textContent = mode === "paint"
      ? "โหมดวาดรอยไหม้: กดค้างเพื่อเผา หรือเลื่อนนิ้วเพื่อวาดแนวไหม้"
      : "โหมดหมุน: ลากนิ้วหนึ่งนิ้วเพื่อหมุน และใช้สองนิ้วเพื่อซูม";

    pointers.clear();
    stopActivePaint();
  }

  // เตรียม Canvas จาก Base Color Texture เดิม
  function preparePaintTextures() {

    if (!mesh.object3D) {
      throw new Error("ยังไม่พบ Object3D ของโมเดล");
    }

    const textureCache = new Map();
    let usable = 0;

    mesh.object3D.traverse(node => {

      if (!node.isMesh || !node.material) return;

      const materials = Array.isArray(node.material)
        ? node.material
        : [node.material];

      const newMaterials = materials.map(originalMaterial => {

        if (!originalMaterial.map || !originalMaterial.map.image) {
          return originalMaterial;
        }

        const originalMap = originalMaterial.map;

        let paintData = textureCache.get(originalMap.uuid);

        if (!paintData) {

          const image = originalMap.image;

          const width =
            image.naturalWidth ||
            image.videoWidth ||
            image.width;

          const height =
            image.naturalHeight ||
            image.videoHeight ||
            image.height;

          if (!width || !height) return originalMaterial;

          const canvas = document.createElement("canvas");

          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d");

          ctx.drawImage(image, 0, 0, width, height);

          const paintTexture = originalMap.clone();

          paintTexture.image = canvas;
          paintTexture.flipY = originalMap.flipY;
          paintTexture.needsUpdate = true;

          paintData = {
            canvas,
            ctx,
            texture: paintTexture,
            width,
            height,
            originalMap
          };

          textureCache.set(originalMap.uuid, paintData);
          paintMaterials.push(paintData);
        }

        const clonedMaterial = originalMaterial.clone();

        clonedMaterial.map = paintData.texture;
        clonedMaterial.needsUpdate = true;

        usable++;

        return clonedMaterial;
      });

      node.material = Array.isArray(node.material)
        ? newMaterials
        : newMaterials[0];

    });

    if (!usable) {
      throw new Error(
        "ไม่พบ Base Color Texture ที่ใช้วาดได้ในโมเดล"
      );
    }

    modelStatus.textContent =
      "โมเดลพร้อมใช้งาน • วาดรอยไหม้ได้";

    console.log("Paintable textures:", paintMaterials.length);
  }

  mesh.addEventListener("model-loaded", () => {

    modelLoaded = true;
    requestAnimationFrame(attachInteractionHandlers);

    modelStatus.textContent =
      "กำลังเตรียม Texture สำหรับวาดรอยไหม้...";

    try {
      preparePaintTextures();
    } catch (error) {
      console.error("Texture setup error:", error);

      modelStatus.textContent =
        "โมเดลโหลดแล้ว แต่เตรียม Texture ไม่สำเร็จ: " +
        error.message;

      modelStatus.classList.add("error");
    }
  });

  mesh.addEventListener("model-error", event => {

    console.error("GLB error", event);

    modelStatus.textContent =
      "โหลดโมเดลไม่สำเร็จ ตรวจสอบชื่อไฟล์ base_basic_pbr.glb";

    modelStatus.classList.add("error");
  });

  target.addEventListener("targetFound", () => {

    targetFound = true;

    hint.textContent = interactionMode === "paint"
      ? "โหมดวาดรอยไหม้: กดค้างหรือเลื่อนนิ้วบนโมเดล"
      : "โหมดหมุน: ลากโมเดลเพื่อหมุน หรือใช้ปุ่มด้านล่าง";

    controls.style.display = "flex";
    modelStatus.style.display = "block";
  });

  target.addEventListener("targetLost", () => {

    targetFound = false;
    pointers.clear();

    stopActivePaint();

    controls.style.display = "none";
    modelStatus.style.display = "none";

    hint.textContent = "ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล";
  });

  scene.addEventListener("arReady", () => {
    status.textContent =
      "กล้องพร้อมแล้ว กำลังค้นหาโปสเตอร์...";
  });

  scene.addEventListener("arError", event => {
    console.error("AR error", event);
    showError("ระบบ AR เกิดข้อผิดพลาด กรุณาลองใหม่");
  });

  function showError(message) {
    status.textContent = message;
    startLayer.style.display = "grid";
    startBtn.disabled = false;
  }

  function waitForVideo(timeout = 15000) {

    return new Promise((resolve, reject) => {

      const startTime = Date.now();

      function check() {

        const active =
          [...document.querySelectorAll("video")].find(v =>
            v.videoWidth > 0 &&
            v.videoHeight > 0 &&
            v.readyState >= 2
          );

        if (active) return resolve(active);

        if (Date.now() - startTime > timeout) {
          return reject(
            new Error("ยังไม่ได้รับภาพจากกล้อง")
          );
        }

        requestAnimationFrame(check);
      }

      check();
    });
  }

  startBtn.addEventListener("click", async () => {

    if (cameraStarted) return;

    startBtn.disabled = true;
    status.textContent = "กำลังเปิดกล้อง...";

    try {

      if (!window.isSecureContext) {
        throw new Error("ต้องเปิดเว็บไซต์ผ่าน HTTPS");
      }

      await waitForScene();

      const mindar =
        scene.systems["mindar-image-system"];

      if (!mindar) {
        throw new Error("ไม่พบระบบ MindAR");
      }

      await mindar.start();
      await waitForVideo();

      cameraStarted = true;

      startLayer.style.display = "none";

          hint.style.display = "block";

    } catch (error) {

      console.error(error);

      try {
        const mindar =
          scene.systems["mindar-image-system"];

        if (mindar) await mindar.stop();

      } catch (e) {
        console.error(e);
      }

      cameraStarted = false;

      showError(
        "เปิดกล้องไม่สำเร็จ: " + error.message
      );

    } finally {
      startBtn.disabled = false;
    }

  });

  function getDistance() {

    const p = [...pointers.values()];

    if (p.length < 2) return 0;

    const dx = p[0].x - p[1].x;
    const dy = p[0].y - p[1].y;

    return Math.sqrt(dx * dx + dy * dy);
  }

  // Raycasting เพื่อหาตำแหน่ง UV จริงบนโมเดล
  const raycaster = new THREE.Raycaster();
  const pointerNdc = new THREE.Vector2();

  function getModelUV(clientX, clientY) {

    if (!modelLoaded || !scene.camera || !mesh.object3D) {
      return null;
    }

    const canvas =
      scene.renderer && scene.renderer.domElement;

    if (!canvas) return null;

    const rect = canvas.getBoundingClientRect();

    if (!rect.width || !rect.height) return null;

    pointerNdc.x =
      ((clientX - rect.left) / rect.width) * 2 - 1;

    pointerNdc.y =
      -((clientY - rect.top) / rect.height) * 2 + 1;

    scene.camera.updateMatrixWorld(true);
    mesh.object3D.updateMatrixWorld(true);

    raycaster.setFromCamera(pointerNdc, scene.camera);

    const hits =
      raycaster.intersectObject(mesh.object3D, true);

    if (!hits.length) return null;

    const hit = hits.find(item => item.uv);

    if (!hit) return null;

    return {
      u: hit.uv.x,
      v: hit.uv.y
    };
  }

  function getBrushRadius(data, multiplier = 1) {

    const slider = Number(brushSizeInput.value);

    return Math.max(
      2,
      (slider / 100) *
      Math.min(data.width, data.height) *
      multiplier
    );
  }

  // วาดรอยไหม้แบบขอบฟุ้ง
  function stampBurn(data, uv, radius, strength) {

    const x = uv.u * data.width;
    const y = (1 - uv.v) * data.height;

    const r = Math.max(1.5, radius);

    const opacity =
      Math.max(0.03, Math.min(0.92, strength));

    const gradient =
      data.ctx.createRadialGradient(
        x, y, r * 0.04,
        x, y, r
      );

    gradient.addColorStop(
      0, `rgba(25, 12, 8, ${opacity})`
    );

    gradient.addColorStop(
      0.28, `rgba(75, 25, 14, ${opacity * 0.92})`
    );

    gradient.addColorStop(
      0.58, `rgba(145, 55, 28, ${opacity * 0.66})`
    );

    gradient.addColorStop(
      0.82, `rgba(100, 38, 20, ${opacity * 0.30})`
    );

    gradient.addColorStop(
      1, "rgba(65, 25, 15, 0)"
    );

    data.ctx.save();

    data.ctx.globalCompositeOperation = "multiply";
    data.ctx.fillStyle = gradient;

    data.ctx.beginPath();
    data.ctx.arc(x, y, r, 0, Math.PI * 2);
    data.ctx.fill();

    data.ctx.restore();

    data.texture.needsUpdate = true;
  }

  function paintAtUV(
    uv,
    strength = 0.35,
    radiusMultiplier = 1
  ) {

    if (!paintMaterials.length || !uv) return;

    paintMaterials.forEach(data => {

      stampBurn(
        data,
        uv,
        getBrushRadius(data, radiusMultiplier),
        strength
      );

    });
  }

  function interpolateAndPaint(
    from,
    to,
    strength,
    radiusMultiplier = 1
  ) {

    if (!from || !to) return;

    paintMaterials.forEach(data => {

      const dx = (to.u - from.u) * data.width;
      const dy = (to.v - from.v) * data.height;

      const distance = Math.sqrt(dx * dx + dy * dy);

      const radius =
        getBrushRadius(data, radiusMultiplier);

      const steps = Math.max(
        1,
        Math.ceil(distance / Math.max(2, radius * 0.28))
      );

      for (let i = 1; i <= steps; i++) {

        const t = i / steps;

        stampBurn(
          data,
          {
            u: from.u + (to.u - from.u) * t,
            v: from.v + (to.v - from.v) * t
          },
          radius,
          strength
        );

      }

    });
  }

  function stopActivePaint() {

    activePaint = null;

    if (paintAnimation) {
      cancelAnimationFrame(paintAnimation);
      paintAnimation = 0;
    }
  }

  // กดค้างแล้วรอยไหม้ค่อย ๆ เข้มและขยาย
  function animateHeldBurn() {

    if (!activePaint) return;

    const elapsed =
      (performance.now() - activePaint.startedAt) / 1000;

    const speed = Number(burnSpeedInput.value);

    const intensity = Math.min(
      0.88,
      0.10 + elapsed * (0.10 + speed * 0.035)
    );

    const growth = 1 + Math.min(
      2.8,
      elapsed * (0.12 + speed * 0.045)
    );

    paintAtUV(
      activePaint.uv,
      intensity,
      growth
    );

    paintAnimation =
      requestAnimationFrame(animateHeldBurn);
  }

  function beginPaint(clientX, clientY) {

    const uv = getModelUV(clientX, clientY);

    if (!uv) return false;

    activePaint = {
      uv,
      startedAt: performance.now()
    };

    paintAtUV(uv, 0.22, 0.75);

    paintAnimation =
      requestAnimationFrame(animateHeldBurn);

    return true;
  }

  // ลากนิ้วแล้ววาดรอยไหม้ต่อเนื่อง
  function movePaint(clientX, clientY) {

    if (!activePaint) return;

    const uv = getModelUV(clientX, clientY);

    if (!uv) return;

    const speed = Number(burnSpeedInput.value);
    const strength = 0.18 + speed * 0.035;

    interpolateAndPaint(
      activePaint.uv,
      uv,
      strength,
      1
    );

    activePaint.uv = uv;
  }

  // รับการสัมผัสจาก canvas ของ A-Frame โดยตรง
  // setPointerCapture ช่วยให้ลากต่อเนื่องแม้นิ้วเคลื่อนออกจากตำแหน่งเริ่มต้น
  const interactionCanvas = () =>
    scene.renderer && scene.renderer.domElement;

  function isControlTouch(event) {
    return !!(
      event.target &&
      event.target.closest &&
      event.target.closest("#controls")
    );
  }

  function onPointerDown(event) {

    if (!targetFound || isControlTouch(event)) return;

    if (
      event.pointerType === "mouse" &&
      event.button !== 0
    ) return;

    const canvas = interactionCanvas();

    if (!canvas) return;

    if (interactionMode === "paint") {

      // วาดได้เฉพาะเมื่อ raycast ชนพื้นผิวโมเดลจริง
      if (pointers.size > 0) return;

      const started =
        beginPaint(event.clientX, event.clientY);

      if (!started) return;

      event.preventDefault();
      event.stopPropagation();

      try {
        canvas.setPointerCapture(event.pointerId);
      } catch (e) {}

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      return;
    }

    // โหมดหมุน: จัดเก็บนิ้วเพื่อหมุน/ซูม
    event.preventDefault();
    event.stopPropagation();

    try {
      canvas.setPointerCapture(event.pointerId);
    } catch (e) {}

    pointers.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });

    if (pointers.size === 1) {
      previousX = event.clientX;
      previousY = event.clientY;
    } else if (pointers.size === 2) {
      previousDistance = getDistance();
    }
  }

  function onPointerMove(event) {

    if (
      !targetFound ||
      !pointers.has(event.pointerId)
    ) return;

    event.preventDefault();
    event.stopPropagation();

    if (interactionMode === "paint") {

      movePaint(event.clientX, event.clientY);

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      return;
    }

    pointers.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });

    if (pointers.size >= 2) {

      const newDistance = getDistance();

      if (
        previousDistance > 0 &&
        newDistance > 0
      ) {

        zoom +=
          (newDistance - previousDistance) * 0.002;

        zoom = Math.max(
          MIN_ZOOM,
          Math.min(MAX_ZOOM, zoom)
        );

        updateModel();
      }

      previousDistance = newDistance;
      return;
    }

    const dx = event.clientX - previousX;
    const dy = event.clientY - previousY;

    previousX = event.clientX;
    previousY = event.clientY;

    rotY += dx * ROTATE_SPEED;
    rotX -= dy * ROTATE_SPEED;

    updateModel();
  }

   function releasePointer(event) {

    if (!pointers.has(event.pointerId)) return;

    pointers.delete(event.pointerId);

    if (interactionMode === "paint") {

      stopActivePaint();

    } else {

      if (pointers.size === 1) {
        const p = [...pointers.values()][0];

        previousX = p.x;
        previousY = p.y;
      }

      previousDistance =
        pointers.size >= 2 ? getDistance() : 0;
    }

    const canvas = interactionCanvas();

    try {
      if (
        canvas &&
        canvas.hasPointerCapture(event.pointerId)
      ) {
        canvas.releasePointerCapture(event.pointerId);
      }
    } catch (e) {}
  }

  // ผูก listener กับ canvas แทน document
  function attachInteractionHandlers() {

    const canvas = interactionCanvas();

    if (
      !canvas ||
      canvas.dataset.touchHandlersReady === "1"
    ) return;

    canvas.dataset.touchHandlersReady = "1";
    canvas.style.touchAction = "none";

    canvas.addEventListener(
      "pointerdown",
      onPointerDown,
      { passive: false }
    );

    canvas.addEventListener(
      "pointermove",
      onPointerMove,
      { passive: false }
    );

    canvas.addEventListener(
      "pointerup",
      releasePointer
    );

    canvas.addEventListener(
      "pointercancel",
      releasePointer
    );

    canvas.addEventListener(
      "lostpointercapture",
      releasePointer
    );
  }

  // A-Frame อาจสร้าง canvas หลัง scene โหลดเสร็จ
  scene.addEventListener(
    "renderstart",
    attachInteractionHandlers
  );

  scene.addEventListener("loaded", () => {
    requestAnimationFrame(attachInteractionHandlers);
  });

  // ป้องกันเมนูคลิกขวาบนโมเดล
  document.addEventListener("contextmenu", event => {
    if (!isControlTouch(event)) {
      event.preventDefault();
    }
  });

  // สลับโหมด
  modeRotate.addEventListener(
    "click",
    () => setMode("rotate")
  );

  modePaint.addEventListener(
    "click",
    () => setMode("paint")
  );

  // ปรับขนาดรอยไหม้
  brushSizeInput.addEventListener("input", () => {
    brushValue.textContent = brushSizeInput.value;
  });

  // ปรับความเข้ม
  burnSpeedInput.addEventListener("input", () => {
    speedValue.textContent = burnSpeedInput.value;
  });

  // ลบรอยไหม้ทั้งหมด
  document.getElementById("clearBurns")
    .addEventListener("click", () => {

      stopActivePaint();

      paintMaterials.forEach(data => {

        data.ctx.clearRect(
          0,
          0,
          data.width,
          data.height
        );

        data.ctx.drawImage(
          data.originalMap.image,
          0,
          0,
          data.width,
          data.height
        );

        data.texture.needsUpdate = true;
      });

      modelStatus.textContent =
        "ลบรอยไหม้ทั้งหมดแล้ว";
    });

  // ปุ่มควบคุมโมเดล
  document.querySelectorAll("[data-action]")
    .forEach(button => {

      button.addEventListener("click", () => {

        if (!targetFound) return;

        const action = button.dataset.action;
        const step = 15;

        switch (action) {

          case "left":
            rotY -= step;
            break;

          case "right":
            rotY += step;
            break;

          case "up":
            rotX -= step;
            break;

          case "down":
            rotX += step;
            break;

          case "tiltLeft":
            rotZ -= step;
            break;

          case "tiltRight":
            rotZ += step;
            break;

          case "zoomIn":
            zoom = Math.min(
              MAX_ZOOM,
              zoom + 0.05
            );
            break;

          case "zoomOut":
            zoom = Math.max(
              MIN_ZOOM,
              zoom - 0.05
            );
            break;
        }

        updateModel();
      });

    });

   // ซูมด้วยลูกกลิ้งเมาส์
  document.addEventListener("wheel", event => {

    if (!targetFound) return;

    if (interactionMode !== "rotate") return;

    if (event.target.closest("#controls")) return;

    event.preventDefault();

    zoom -= event.deltaY * 0.001;

    zoom = Math.max(
      MIN_ZOOM,
      Math.min(MAX_ZOOM, zoom)
    );

    updateModel();

  }, { passive: false });

  document.getElementById("resetBtn")
    .addEventListener("click", resetModel);

  // ปิดกล้อง
  document.getElementById("stopBtn")
    .addEventListener("click", async () => {

      try {

        const mindar =
          scene.systems["mindar-image-system"];

        if (mindar && cameraStarted) {
          await mindar.stop();
        }

      } catch (error) {
        console.error(error);
      }

      cameraStarted = false;
      targetFound = false;

      pointers.clear();
      stopActivePaint();

      resetModel();

      controls.style.display = "none";
      hint.style.display = "none";
      modelStatus.style.display = "none";

      startLayer.style.display = "grid";

      status.textContent =
        "ปิดกล้องแล้ว กดเริ่มสแกนเพื่อใช้งานอีกครั้ง";

    });

  updateModel();

})();
</script>

</body>
</html>
