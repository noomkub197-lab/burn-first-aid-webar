
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WebAR ปฐมพยาบาลแผลไฟไหม้</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: system-ui, sans-serif;
  touch-action: none;
  color: white;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1;
  background: transparent !important;
}

a-scene canvas {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: transparent !important;
  touch-action: none !important;
}

video {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  z-index: 0 !important;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(145deg,#10243a,#1b3953);
  text-align: center;
}

.panel {
  width: 100%;
  max-width: 440px;
  padding: 25px;
  border: 1px solid #ffffff35;
  border-radius: 20px;
  background: #ffffff12;
}

h2 { margin-top: 0; }

button {
  color: white;
  background: #18334e;
  border: 1px solid #ffffff55;
  border-radius: 12px;
  padding: 11px 15px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  background: #dc3e36;
}

#startBtn {
  width: 100%;
  background: #dc3e36;
  margin-top: 10px;
}

#status {
  font-size: 13px;
  line-height: 1.6;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

#hint {
  display: none;
  position: fixed;
  z-index: 10;
  top: 12px;
  left: 10px;
  right: 10px;
  padding: 10px;
  text-align: center;
  border-radius: 12px;
  background: #14283bea;
  font-size: 13px;
  pointer-events: none;
}

#modelStatus {
  display: none;
  position: fixed;
  z-index: 10;
  top: 57px;
  left: 10px;
  right: 10px;
  text-align: center;
  font-size: 12px;
  pointer-events: none;
}

#controls {
  display: none;
  position: fixed;
  z-index: 20;
  bottom: 12px;
  left: 0;
  right: 0;
  padding: 8px;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  pointer-events: none;
}

.control-row {
  display: flex;
  justify-content: center;
  gap: 8px;
  pointer-events: auto;
}

.control-row button {
  min-width: 48px;
  min-height: 43px;
  background: #142b43ed;
  box-shadow: 0 2px 8px #0005;
}

.control-row .wide {
  min-width: 110px;
}

#controls button {
  touch-action: manipulation;
}

#zoomValue {
  font-size: 12px;
  background: #14283bea;
  border-radius: 10px;
  padding: 7px 12px;
}
</style>
</head>

<body>

<div id="start">
  <div class="panel">
    <h2>WebAR ปฐมพยาบาลแผลไฟไหม้</h2>
    <p>
      สแกนโปสเตอร์เพื่อแสดงโมเดล 3 มิติ<br>
      สามารถหมุนและซูมโมเดลได้รอบทิศทาง
    </p>
    <button id="startBtn">เริ่มสแกนโปสเตอร์</button>
    <div id="status">กดเริ่มสแกนและอนุญาตให้ใช้กล้อง</div>
  </div>
</div>

<div id="hint">ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล</div>
<div id="modelStatus">กำลังโหลดโมเดล 3 มิติ...</div>

<div id="controls">

  <div class="control-row">
    <button data-action="up">▲</button>
  </div>

  <div class="control-row">
    <button data-action="left">◀</button>
    <button data-action="down">▼</button>
    <button data-action="right">▶</button>
  </div>

  <div class="control-row">
    <button data-action="tiltLeft">↶ เอียง</button>
    <button data-action="tiltRight">เอียง ↷</button>
  </div>

  <div class="control-row">
    <button data-action="zoomOut">− ซูม</button>
    <span id="zoomValue">100%</span>
    <button data-action="zoomIn">+ ซูม</button>
  </div>

  <div class="control-row">
    <button class="wide" id="resetBtn">รีเซ็ตมุมมอง</button>
    <button class="wide" id="stopBtn">ปิดกล้อง</button>
  </div>

</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes;"
  color-space="sRGB"
  embedded
  renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true; antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="60000">
    <a-asset-item
      id="burnModel"
      src="./base_basic_pbr.glb">
    </a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="posterTarget"
    mindar-image-target="targetIndex: 0">

    <a-entity
      id="modelRoot"
      position="0 0.05 0.05"
      rotation="0 0 0"
      scale="0.42 0.42 0.42">

      <a-entity
        id="modelMesh"
        gltf-model="#burnModel"
        position="0 -0.217 0"
        rotation="90 0 0">
      </a-entity>

    </a-entity>
  </a-entity>
</a-scene>

<script>
(() => {

  const scene = document.querySelector("a-scene");
  const target = document.getElementById("posterTarget");
  const root = document.getElementById("modelRoot");
  const mesh = document.getElementById("modelMesh");

  const startLayer = document.getElementById("start");
  const startBtn = document.getElementById("startBtn");
  const status = document.getElementById("status");
  const hint = document.getElementById("hint");
  const modelStatus = document.getElementById("modelStatus");
  const controls = document.getElementById("controls");
  const zoomValue = document.getElementById("zoomValue");

  let cameraStarted = false;
  let targetFound = false;
  let modelLoaded = false;

  // ค่ามุมหมุน 3 แกน
  let rotX = 0;
  let rotY = 0;
  let rotZ = 0;

  // ค่าซูม
  const BASE_ZOOM = 0.42;
  let zoom = BASE_ZOOM;

  const MIN_ZOOM = 0.15;
  const MAX_ZOOM = 1.30;

  // ความไวของการลาก
  const ROTATE_SPEED = 0.7;

  // เก็บนิ้วที่สัมผัสหน้าจอ
  const pointers = new Map();

  let previousX = 0;
  let previousY = 0;
  let previousDistance = 0;

  function updateModel() {
    root.setAttribute(
      "rotation",
      `${rotX} ${rotY} ${rotZ}`
    );

    root.setAttribute(
      "scale",
      `${zoom} ${zoom} ${zoom}`
    );

    zoomValue.textContent =
      Math.round((zoom / BASE_ZOOM) * 100) + "%";
  }

  function resetModel() {
    rotX = 0;
    rotY = 0;
    rotZ = 0;
    zoom = BASE_ZOOM;
    updateModel();
  }

  function waitForScene() {
    return new Promise(resolve => {
      if (scene.hasLoaded) {
        resolve();
      } else {
        scene.addEventListener("loaded", resolve, { once: true });
      }
    });
  }

  mesh.addEventListener("model-loaded", () => {
    modelLoaded = true;
    modelStatus.textContent = "โมเดล 3 มิติพร้อมใช้งาน";
    console.log("GLB loaded");
  });

  mesh.addEventListener("model-error", event => {
    console.error("GLB error", event);
    modelStatus.textContent = "โหลดโมเดลไม่สำเร็จ";
  });

  target.addEventListener("targetFound", () => {
    targetFound = true;
    hint.textContent = "ลากโมเดลเพื่อหมุน หรือใช้ปุ่มด้านล่าง";
    controls.style.display = "flex";
    modelStatus.style.display = "block";
  });

  target.addEventListener("targetLost", () => {
    targetFound = false;
    pointers.clear();
    controls.style.display = "none";
    modelStatus.style.display = "none";
    hint.textContent = "ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล";
  });

  scene.addEventListener("arReady", () => {
    status.textContent = "กล้องพร้อมแล้ว กำลังค้นหาโปสเตอร์...";
  });

  scene.addEventListener("arError", event => {
    console.error("AR error", event);
    showError("ระบบ AR เกิดข้อผิดพลาด กรุณาลองใหม่");
  });

  function showError(message) {
    status.textContent = message;
    startLayer.style.display = "grid";
    startBtn.disabled = false;
  }

  function waitForVideo(timeout = 15000) {
    return new Promise((resolve, reject) => {
      const startTime = Date.now();

      function check() {
        const videos = [...document.querySelectorAll("video")];

        const active = videos.find(v =>
          v.videoWidth > 0 &&
          v.videoHeight > 0 &&
          v.readyState >= 2
        );

        if (active) return resolve(active);

        if (Date.now() - startTime > timeout) {
          return reject(new Error("ยังไม่ได้รับภาพจากกล้อง"));
        }

        requestAnimationFrame(check);
      }

      check();
    });
  }

  startBtn.addEventListener("click", async () => {
    if (cameraStarted) return;

    startBtn.disabled = true;
    status.textContent = "กำลังเปิดกล้อง...";

    try {
      if (!window.isSecureContext) {
        throw new Error("ต้องเปิดเว็บไซต์ผ่าน HTTPS");
      }

      await waitForScene();

      const mindar = scene.systems["mindar-image-system"];

      if (!mindar) {
        throw new Error("ไม่พบระบบ MindAR");
      }

      await mindar.start();
      await waitForVideo();

      cameraStarted = true;
      startLayer.style.display = "none";
      hint.style.display = "block";

    } catch (error) {
      console.error(error);

      try {
        const mindar = scene.systems["mindar-image-system"];
        if (mindar) await mindar.stop();
      } catch (e) {
        console.error(e);
      }

      cameraStarted = false;
      showError("เปิดกล้องไม่สำเร็จ: " + error.message);

    } finally {
      startBtn.disabled = false;
    }
  });

  // คำนวณระยะห่างระหว่างนิ้วสองนิ้ว
  function getDistance() {
    const p = [...pointers.values()];

    if (p.length < 2) return 0;

    const dx = p[0].x - p[1].x;
    const dy = p[0].y - p[1].y;

    return Math.sqrt(dx * dx + dy * dy);
  }

  // รับการลากจากทั้งหน้าเว็บ ไม่ผูกกับ canvas อย่างเดียว
  document.addEventListener("pointerdown", event => {

    if (!targetFound) return;

    if (event.target.closest("#controls")) return;

    if (event.pointerType === "mouse" && event.button !== 0) return;

    pointers.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });

    if (pointers.size === 1) {
      previousX = event.clientX;
      previousY = event.clientY;
    }

    if (pointers.size === 2) {
      previousDistance = getDistance();
    }

  }, true);

  document.addEventListener("pointermove", event => {

    if (!targetFound || !pointers.has(event.pointerId)) return;

    event.preventDefault();

    pointers.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });

    // ใช้สองนิ้วซูม
    if (pointers.size >= 2) {

      const newDistance = getDistance();

      if (previousDistance > 0 && newDistance > 0) {

        const difference = newDistance - previousDistance;

        zoom += difference * 0.002;
        zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));

        updateModel();
      }

      previousDistance = newDistance;
      return;
    }

    // ใช้หนึ่งนิ้วหมุน 3 แกน
    const dx = event.clientX - previousX;
    const dy = event.clientY - previousY;

    previousX = event.clientX;
    previousY = event.clientY;

    rotY += dx * ROTATE_SPEED;
    rotX -= dy * ROTATE_SPEED;

    updateModel();

  }, { capture: true, passive: false });

  function releasePointer(event) {

    pointers.delete(event.pointerId);

    if (pointers.size === 1) {
      const p = [...pointers.values()][0];
      previousX = p.x;
      previousY = p.y;
    }

    previousDistance = pointers.size >= 2
      ? getDistance()
      : 0;
  }

  document.addEventListener("pointerup", releasePointer, true);
  document.addEventListener("pointercancel", releasePointer, true);

  // ปุ่มควบคุมบนหน้าจอ
  document.querySelectorAll("[data-action]").forEach(button => {

    button.addEventListener("click", () => {

      if (!targetFound) return;

      const action = button.dataset.action;
      const step = 15;

      switch (action) {

        case "left":
          rotY -= step;
          break;

        case "right":
          rotY += step;
          break;

        case "up":
          rotX -= step;
          break;

        case "down":
          rotX += step;
          break;

        case "tiltLeft":
          rotZ -= step;
          break;

        case "tiltRight":
          rotZ += step;
          break;

        case "zoomIn":
          zoom = Math.min(MAX_ZOOM, zoom + 0.05);
          break;

        case "zoomOut":
          zoom = Math.max(MIN_ZOOM, zoom - 0.05);
          break;
      }

      updateModel();
    });

  });

  // ซูมด้วยลูกกลิ้งเมาส์
  document.addEventListener("wheel", event => {

    if (!targetFound) return;

    if (event.target.closest("#controls")) return;

    event.preventDefault();

    zoom -= event.deltaY * 0.001;
    zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom));

    updateModel();

  }, { passive: false });

  document.getElementById("resetBtn")
    .addEventListener("click", resetModel);

  document.getElementById("stopBtn")
    .addEventListener("click", async () => {

      try {
        const mindar = scene.systems["mindar-image-system"];

        if (mindar && cameraStarted) {
          await mindar.stop();
        }
      } catch (error) {
        console.error(error);
      }

      cameraStarted = false;
      targetFound = false;
      pointers.clear();

      resetModel();

      controls.style.display = "none";
      hint.style.display = "none";
      modelStatus.style.display = "none";
      startLayer.style.display = "grid";

      status.textContent = "ปิดกล้องแล้ว กดเริ่มสแกนเพื่อใช้งานอีกครั้ง";
    });

  updateModel();

})();
</script>

</body>
</html>
