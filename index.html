
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WebAR ปฐมพยาบาลแผลไฟไหม้</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: system-ui, sans-serif;
  touch-action: none;
  color: white;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1;
  background: transparent !important;
}

a-scene canvas {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: transparent !important;
  touch-action: none !important;
}

video {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  z-index: 0 !important;
}

#start {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: grid;
  place-items: center;
  padding: 20px;
  background: linear-gradient(145deg,#10243a,#1b3953);
  text-align: center;
}

.panel {
  width: 100%;
  max-width: 440px;
  padding: 25px;
  border: 1px solid #ffffff35;
  border-radius: 20px;
  background: #ffffff12;
}

h2 { margin-top: 0; }

button {
  color: white;
  background: #18334e;
  border: 1px solid #ffffff55;
  border-radius: 12px;
  padding: 11px 15px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active { background: #dc3e36; }

button:disabled { opacity: .5; }

#startBtn {
  width: 100%;
  background: #dc3e36;
  margin-top: 10px;
}

#status {
  font-size: 13px;
  line-height: 1.6;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

#hint {
  display: none;
  position: fixed;
  z-index: 10;
  top: 10px;
  left: 10px;
  right: 10px;
  padding: 9px;
  text-align: center;
  border-radius: 12px;
  background: #14283bea;
  font-size: 12px;
  pointer-events: none;
}

#modelStatus {
  display: none;
  position: fixed;
  z-index: 10;
  top: 49px;
  left: 10px;
  right: 10px;
  text-align: center;
  font-size: 11px;
  pointer-events: none;
  text-shadow: 0 1px 3px #000;
}

#controls {
  display: none;
  position: fixed;
  z-index: 20;
  bottom: 8px;
  left: 0;
  right: 0;
  padding: 6px;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  max-height: 60vh;
  overflow-y: auto;
}

.control-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 7px;
  pointer-events: auto;
  flex-wrap: wrap;
}

.control-row button {
  min-width: 43px;
  min-height: 39px;
  padding: 8px 11px;
  background: #142b43ed;
  box-shadow: 0 2px 8px #0005;
}

.control-row .wide { min-width: 104px; }

#zoomValue, #brushValue, #speedValue {
  font-size: 11px;
  background: #14283bea;
  border-radius: 10px;
  padding: 7px 9px;
}

#paintPanel {
  display: none;
  width: min(94vw, 430px);
  padding: 8px 10px;
  border-radius: 13px;
  background: #14283bed;
  pointer-events: auto;
  box-shadow: 0 2px 10px #0006;
}

#paintPanel .setting {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  margin: 5px 0;
}

#paintPanel input[type="range"] {
  flex: 1;
  min-width: 80px;
  accent-color: #ff765d;
}

#paintPanel .paint-actions {
  display: flex;
  justify-content: center;
  margin-top: 6px;
}

#paintPanel button {
  min-height: 34px;
  padding: 7px 11px;
}

#modeRotate.active { background: #147d9c; }
#modePaint.active { background: #b83d32; }
#clearBurns { background: #8e2929; }
#modelStatus.error { color: #ffb5a9; }

@media (max-height: 650px) {
  #controls { gap: 4px; }
  .control-row button {
    min-height: 34px;
    padding: 7px 10px;
  }
}
</style>
</head>

<body>

<div id="start">
  <div class="panel">
    <h2>WebAR ปฐมพยาบาลแผลไฟไหม้</h2>
    <p>
      สแกนโปสเตอร์เพื่อแสดงโมเดล 3 มิติ<br>
      หมุน ซูม และทดลองสร้างรอยไหม้บนโมเดลได้
    </p>
    <button id="startBtn">เริ่มสแกนโปสเตอร์</button>
    <div id="status">กดเริ่มสแกนและอนุญาตให้ใช้กล้อง</div>
  </div>
</div>

<div id="hint">ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล</div>
<div id="modelStatus">กำลังโหลดโมเดล 3 มิติ...</div>

<div id="controls">

  <div class="control-row">
    <button id="modeRotate" class="active">↔ หมุนโมเดล</button>
    <button id="modePaint">🔥 วาดรอยไหม้</button>
  </div>

  <div id="paintPanel">
    <div class="setting">
      <label for="brushSize">ขนาดรอยไหม้</label>
      <input id="brushSize" type="range" min="8" max="110" value="38">
      <span id="brushValue">38</span>
    </div>

    <div class="setting">
      <label for="burnSpeed">ความเข้ม</label>
      <input id="burnSpeed" type="range" min="1" max="10" value="5">
      <span id="speedValue">5</span>
    </div>

    <div class="paint-actions">
      <button id="clearBurns">ลบรอยไหม้ทั้งหมด</button>
    </div>
  </div>

  <div class="control-row" id="rotateControls">
    <button data-action="up">▲</button>
  </div>

  <div class="control-row" id="rotateControls2">
    <button data-action="left">◀</button>
    <button data-action="down">▼</button>
    <button data-action="right">▶</button>
  </div>

  <div class="control-row" id="rotateControls3">
    <button data-action="tiltLeft">↶ เอียง</button>
    <button data-action="tiltRight">เอียง ↷</button>
  </div>

  <div class="control-row" id="zoomControls">
    <button data-action="zoomOut">− ซูม</button>
    <span id="zoomValue">100%</span>
    <button data-action="zoomIn">+ ซูม</button>
  </div>

  <div class="control-row">
    <button class="wide" id="resetBtn">รีเซ็ตมุมมอง</button>
    <button class="wide" id="stopBtn">ปิดกล้อง</button>
  </div>

</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiScanning: yes; uiLoading: yes;"
  color-space="sRGB"
  embedded
  renderer="alpha: true; colorManagement: true; physicallyCorrectLights: true; antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets timeout="60000">
    <a-asset-item
      id="burnModel"
      src="./base_basic_pbr.glb">
    </a-asset-item>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="posterTarget"
    mindar-image-target="targetIndex: 0">

    <a-entity
      id="modelRoot"
      position="0 0.05 0.05"
      rotation="0 0 0"
      scale="0.42 0.42 0.42">

      <a-entity
        id="modelMesh"
        gltf-model="#burnModel"
        position="0 -0.217 0"
        rotation="90 0 0">
      </a-entity>

    </a-entity>
  </a-entity>
</a-scene>

<script>
(() => {
  const scene = document.querySelector("a-scene");
  const target = document.getElementById("posterTarget");
  const root = document.getElementById("modelRoot");
  const mesh = document.getElementById("modelMesh");

  const startLayer = document.getElementById("start");
  const startBtn = document.getElementById("startBtn");
  const status = document.getElementById("status");
  const hint = document.getElementById("hint");
  const modelStatus = document.getElementById("modelStatus");
  const controls = document.getElementById("controls");
  const zoomValue = document.getElementById("zoomValue");

  const modeRotate = document.getElementById("modeRotate");
  const modePaint = document.getElementById("modePaint");
  const paintPanel = document.getElementById("paintPanel");

  const brushSizeInput = document.getElementById("brushSize");
  const brushValue = document.getElementById("brushValue");
  const burnSpeedInput = document.getElementById("burnSpeed");
  const speedValue = document.getElementById("speedValue");

  let cameraStarted = false;
  let targetFound = false;
  let modelLoaded = false;
  let interactionMode = "rotate";

  let rotX = 0;
  let rotY = 0;
  let rotZ = 0;

  const BASE_ZOOM = 0.42;
  let zoom = BASE_ZOOM;
  const MIN_ZOOM = 0.15;
  const MAX_ZOOM = 1.30;
  const ROTATE_SPEED = 0.7;

  const pointers = new Map();
  let previousX = 0;
  let previousY = 0;
  let previousDistance = 0;

  let raycaster = null;
  const pointerNdc = new THREE.Vector2();

  // เก็บข้อมูล Canvas แยกตาม Texture จริง
  const paintTextureMap = new Map();
  const paintMaterials = [];

  let activePaint = null;
  let paintAnimation = 0;

  function updateModel() {
    root.setAttribute("rotation", `${rotX} ${rotY} ${rotZ}`);
    root.setAttribute("scale", `${zoom} ${zoom} ${zoom}`);

    zoomValue.textContent =
      Math.round((zoom / BASE_ZOOM) * 100) + "%";
  }

  function resetModel() {
    rotX = 0;
    rotY = 0;
    rotZ = 0;
    zoom = BASE_ZOOM;
    updateModel();
  }

  function waitForScene() {
    return new Promise(resolve => {
      if (scene.hasLoaded) {
        resolve();
      } else {
        scene.addEventListener("loaded", resolve, { once: true });
      }
    });
  }

  // -----------------------------
  // เตรียม Texture โดยรักษาค่าต้นฉบับ
  // -----------------------------

  function preparePaintTextures() {
    if (!mesh.object3D) {
      throw new Error("ไม่พบโมเดล 3 มิติ");
    }

    paintTextureMap.clear();
    paintMaterials.length = 0;

    const textureCache = new Map();
    let usableMaterials = 0;

    mesh.object3D.traverse(node => {
      if (!node.isMesh || !node.material) return;

      const originalMaterials = Array.isArray(node.material)
        ? node.material
        : [node.material];

      const updatedMaterials = originalMaterials.map(originalMaterial => {
        if (!originalMaterial.map || !originalMaterial.map.image) {
          return originalMaterial;
        }

        const originalMap = originalMaterial.map;
        let data = textureCache.get(originalMap.uuid);

        if (!data) {
          const image = originalMap.image;

          const width =
            image.naturalWidth ||
            image.videoWidth ||
            image.width;

          const height =
            image.naturalHeight ||
            image.videoHeight ||
            image.height;

          if (!width || !height) return originalMaterial;

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;

          const ctx = canvas.getContext("2d");

          if (!ctx) return originalMaterial;

          ctx.drawImage(image, 0, 0, width, height);

          // สำรองภาพเดิมไว้สำหรับล้างรอยไหม้
          const backupCanvas = document.createElement("canvas");
          backupCanvas.width = width;
          backupCanvas.height = height;

          backupCanvas.getContext("2d").drawImage(
            image, 0, 0, width, height
          );

          // Clone Texture เพื่อรักษาค่าการตั้งค่าจาก GLB
          const clonedTexture = originalMap.clone();
          clonedTexture.image = canvas;
          clonedTexture.needsUpdate = true;

          data = {
            canvas,
            ctx,
            width,
            height,
            texture: clonedTexture,
            originalMap,
            backupCanvas
          };

          textureCache.set(originalMap.uuid, data);
          paintTextureMap.set(clonedTexture.uuid, data);
          paintMaterials.push(data);
        }

        const clonedMaterial = originalMaterial.clone();
        clonedMaterial.map = data.texture;
        clonedMaterial.needsUpdate = true;

        usableMaterials++;
        return clonedMaterial;
      });

      node.material = Array.isArray(node.material)
        ? updatedMaterials
        : updatedMaterials[0];
    });

    if (!usableMaterials) {
      throw new Error("ไม่พบ Base Color Texture สำหรับระบาย");
    }

    modelStatus.textContent =
      "โมเดลพร้อมใช้งาน • พบ Texture " + paintMaterials.length + " ชุด";

    console.log("Prepared paint textures:", paintMaterials.length);
  }

  mesh.addEventListener("model-loaded", () => {
    modelLoaded = true;

    modelStatus.textContent = "กำลังเตรียม Texture...";

    try {
      preparePaintTextures();

      raycaster = new THREE.Raycaster();

      modelStatus.textContent =
        "โมเดลพร้อมใช้งาน • สามารถระบายแผลได้";

    } catch (error) {
      console.error("Texture setup error:", error);

      modelStatus.textContent =
        "เตรียม Texture ไม่สำเร็จ: " + error.message;

      modelStatus.classList.add("error");
    }
  });

  mesh.addEventListener("model-error", event => {
    console.error("GLB error", event);

    modelStatus.textContent =
      "โหลดโมเดลไม่สำเร็จ ตรวจสอบไฟล์ base_basic_pbr.glb";

    modelStatus.classList.add("error");
  });

  // -----------------------------
  // ระบบค้นหาโปสเตอร์
  // -----------------------------

  target.addEventListener("targetFound", () => {
    targetFound = true;

    controls.style.display = "flex";
    modelStatus.style.display = "block";

    hint.textContent = interactionMode === "paint"
      ? "แตะหรือลากนิ้วบนโมเดลเพื่อระบายแผล"
      : "ลากเพื่อหมุนโมเดล ใช้สองนิ้วเพื่อซูม";
  });

  target.addEventListener("targetLost", () => {
    targetFound = false;
    pointers.clear();
    stopActivePaint();

    controls.style.display = "none";
    modelStatus.style.display = "none";

    hint.textContent = "ส่องกล้องไปที่โปสเตอร์ปฐมพยาบาล";
  });

  scene.addEventListener("arReady", () => {
    status.textContent = "กล้องพร้อมแล้ว กำลังค้นหาโปสเตอร์...";
  });

  scene.addEventListener("arError", event => {
    console.error("AR error", event);
    showError("ระบบ AR เกิดข้อผิดพลาด กรุณาลองใหม่");
  });

  function showError(message) {
    status.textContent = message;
    startLayer.style.display = "grid";
    startBtn.disabled = false;
  }

  // -----------------------------
  // เปิดกล้อง: คงตามโค้ดตัวอย่าง
  // -----------------------------

  function waitForVideo(timeout = 15000) {
    return new Promise((resolve, reject) => {
      const startTime = Date.now();

      function check() {
        const videos = [...document.querySelectorAll("video")];

        const active = videos.find(v =>
          v.videoWidth > 0 &&
          v.videoHeight > 0 &&
          v.readyState >= 2
        );

        if (active) return resolve(active);

        if (Date.now() - startTime > timeout) {
          return reject(new Error("ยังไม่ได้รับภาพจากกล้อง"));
        }

        requestAnimationFrame(check);
      }

      check();
    });
  }

  startBtn.addEventListener("click", async () => {
    if (cameraStarted) return;

    startBtn.disabled = true;
    status.textContent = "กำลังเปิดกล้อง...";

    try {
      if (!window.isSecureContext) {
        throw new Error("ต้องเปิดเว็บไซต์ผ่าน HTTPS");
      }

      await waitForScene();

      const mindar = scene.systems["mindar-image-system"];

      if (!mindar) {
        throw new Error("ไม่พบระบบ MindAR");
      }

      await mindar.start();
      await waitForVideo();

      cameraStarted = true;
      startLayer.style.display = "none";
      hint.style.display = "block";

    } catch (error) {
      console.error(error);

      try {
        const mindar = scene.systems["mindar-image-system"];
        if (mindar) await mindar.stop();
      } catch (e) {
        console.error(e);
      }

      cameraStarted = false;
      showError("เปิดกล้องไม่สำเร็จ: " + error.message);

    } finally {
      startBtn.disabled = false;
    }
  });

  // -----------------------------
  // Raycast: เลือก Material ที่นิ้วชนจริง
  // -----------------------------

  function getModelHit(clientX, clientY) {
    if (!modelLoaded || !raycaster || !scene.camera) {
      return null;
    }

    const canvas = scene.renderer && scene.renderer.domElement;
    if (!canvas) return null;

    const rect = canvas.getBoundingClientRect();

    if (!rect.width || !rect.height) return null;

    pointerNdc.x =
      ((clientX - rect.left) / rect.width) * 2 - 1;

    pointerNdc.y =
      -((clientY - rect.top) / rect.height) * 2 + 1;

    scene.camera.updateMatrixWorld(true);
    mesh.object3D.updateMatrixWorld(true);

    raycaster.setFromCamera(pointerNdc, scene.camera);

    const hits = raycaster.intersectObject(mesh.object3D, true);

    if (!hits.length) return null;

    for (const hit of hits) {
      if (!hit.uv || !hit.object || !hit.object.material) {
        continue;
      }

      const objectMaterial = hit.object.material;

      const material = Array.isArray(objectMaterial)
        ? objectMaterial[hit.face.materialIndex]
        : objectMaterial;

      if (!material || !material.map) continue;

      const data = paintTextureMap.get(material.map.uuid);

      if (!data) continue;

      // แปลง UV ด้วยค่าของ Texture เดิม
      const uv = hit.uv.clone();

      if (material.map.transformUv) {
        material.map.transformUv(uv);
      }

      // แปลง UV เป็นตำแหน่ง Canvas
      const x = uv.x * data.width;
      const y = (1 - uv.y) * data.height;

      return {
        x,
        y,
        data
      };
    }

    return null;
  }

  // -----------------------------
  // วาดรอยไหม้เฉพาะ Texture ที่ชน
  // -----------------------------

  function getBrushRadius(data, multiplier = 1) {
    const size = Number(brushSizeInput.value);

    return Math.max(
      3,
      (size / 100) * Math.min(data.width, data.height) * 0.12 * multiplier
    );
  }

  function stampBurn(hit, strength, radiusMultiplier = 1) {
    if (!hit || !hit.data) return;

    const data = hit.data;
    const ctx = data.ctx;

    const x = hit.x;
    const y = hit.y;

    const radius = getBrushRadius(data, radiusMultiplier);

    const power = Math.max(
      0.05,
      Math.min(0.95, strength)
    );

    ctx.save();

    // ขอบแดงอักเสบ
    const outer = ctx.createRadialGradient(
      x, y, radius * 0.08,
      x, y, radius
    );

    outer.addColorStop(0, `rgba(65,12,8,${0.88 * power})`);
    outer.addColorStop(0.35, `rgba(125,28,17,${0.82 * power})`);
    outer.addColorStop(0.68, `rgba(185,48,30,${0.60 * power})`);
    outer.addColorStop(1, "rgba(180,35,25,0)");

    ctx.globalCompositeOperation = "multiply";
    ctx.fillStyle = outer;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();

    // เนื้อแผลสีน้ำตาลแดง
    const center = ctx.createRadialGradient(
      x - radius * 0.1,
      y - radius * 0.1,
      radius * 0.02,
      x, y,
      radius * 0.65
    );

    center.addColorStop(0, `rgba(45,18,12,${0.90 * power})`);
    center.addColorStop(0.45, `rgba(95,35,20,${0.85 * power})`);
    center.addColorStop(0.8, `rgba(135,45,25,${0.55 * power})`);
    center.addColorStop(1, "rgba(100,30,15,0)");

    ctx.fillStyle = center;
    ctx.beginPath();
    ctx.arc(x, y, radius * 0.72, 0, Math.PI * 2);
    ctx.fill();

    // สะเก็ดสีเข้ม
    const flecks = 4 + Math.round(power * 8);

    for (let i = 0; i < flecks; i++) {
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * radius * 0.55;

      const fx = x + Math.cos(angle) * distance;
      const fy = y + Math.sin(angle) * distance;

      const dotRadius = radius * (0.025 + Math.random() * 0.055);

      ctx.fillStyle = `rgba(30,12,8,${0.35 + power * 0.55})`;

      ctx.beginPath();
      ctx.arc(fx, fy, dotRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    data.texture.needsUpdate = true;
  }

  function paintAt(hit, strength = 0.5, radiusMultiplier = 1) {
    if (!hit) return;

    stampBurn(hit, strength, radiusMultiplier);
  }

  function paintBetween(from, to, strength) {
    if (!from || !to || from.data !== to.data) return;

    const data = to.data;

    const dx = to.x - from.x;
    const dy = to.y - from.y;

    const distance = Math.sqrt(dx * dx + dy * dy);
    const radius = getBrushRadius(data);

    const steps = Math.max(
      1,
      Math.min(60, Math.ceil(distance / Math.max(2, radius * 0.25)))
    );

    for (let i = 1; i <= steps; i++) {
      const t = i / steps;

      stampBurn({
        x: from.x + dx * t,
        y: from.y + dy * t,
        data
      }, strength);
    }
  }

  // -----------------------------
  // กดค้างเพื่อเพิ่มความเข้ม
  // -----------------------------

  function stopActivePaint() {
    activePaint = null;

    if (paintAnimation) {
      cancelAnimationFrame(paintAnimation);
      paintAnimation = 0;
    }
  }

  function animateHeldBurn() {
    if (!activePaint) return;

    const elapsed =
      (performance.now() - activePaint.startedAt) / 1000;

    const speed = Number(burnSpeedInput.value);

    const intensity = Math.min(
      0.90,
      0.15 + elapsed * (0.10 + speed * 0.035)
    );

    const growth = 1 + Math.min(
      2.5,
      elapsed * (0.12 + speed * 0.04)
    );

    paintAt(activePaint.hit, intensity, growth);

    paintAnimation = requestAnimationFrame(animateHeldBurn);
  }

  function beginPaint(clientX, clientY) {
    const hit = getModelHit(clientX, clientY);

    if (!hit) return false;

    activePaint = {
      hit,
      startedAt: performance.now()
    };

    paintAt(hit, 0.45, 0.8);

    paintAnimation = requestAnimationFrame(animateHeldBurn);

    return true;
  }

  function movePaint(clientX, clientY) {
    if (!activePaint) return;

    const hit = getModelHit(clientX, clientY);

    if (!hit) return;

    const speed = Number(burnSpeedInput.value);
    const strength = 0.20 + speed * 0.045;

    paintBetween(activePaint.hit, hit, strength);

    activePaint.hit = hit;
  }

  // -----------------------------
  // เลือกโหมดหมุน / ระบาย
  // -----------------------------

  function setMode(mode) {
    interactionMode = mode;

    modeRotate.classList.toggle("active", mode === "rotate");
    modePaint.classList.toggle("active", mode === "paint");

    paintPanel.style.display =
      mode === "paint" ? "block" : "none";

    document.getElementById("rotateControls").style.display =
      mode === "rotate" ? "flex" : "none";

    document.getElementById("rotateControls2").style.display =
      mode === "rotate" ? "flex" : "none";

    document.getElementById("rotateControls3").style.display =
      mode === "rotate" ? "flex" : "none";

    document.getElementById("zoomControls").style.display =
      mode === "rotate" ? "flex" : "none";

    hint.textContent = mode === "paint"
      ? "แตะหรือลากบนโมเดลเพื่อระบายแผล กดค้างเพื่อเพิ่มความเข้ม"
      : "ลากเพื่อหมุนโมเดล ใช้สองนิ้วเพื่อซูม";

    pointers.clear();
    stopActivePaint();
  }

  modeRotate.addEventListener("click", () => setMode("rotate"));
  modePaint.addEventListener("click", () => setMode("paint"));

  // -----------------------------
  // สัมผัสหน้าจอ
  // -----------------------------

  function getDistance() {
    const points = [...pointers.values()];

    if (points.length < 2) return 0;

    const dx = points[0].x - points[1].x;
    const dy = points[0].y - points[1].y;

    return Math.sqrt(dx * dx + dy * dy);
  }

  document.addEventListener("pointerdown", event => {
    if (!targetFound) return;
    if (event.target.closest("#controls")) return;
    if (event.target.closest("#start")) return;

    if (event.pointerType === "mouse" && event.button !== 0) {
      return;
    }

    if (interactionMode === "paint") {
      if (pointers.size > 0) return;

      const started = beginPaint(event.clientX, event.clientY);

      if (started) {
        event.preventDefault();

        pointers.set(event.pointerId, {
          x: event.clientX,
          y: event.clientY
        });
      }

      return;
    }

    pointers.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });

    if (pointers.size === 1) {
      previousX = event.clientX;
      previousY = event.clientY;
    }

    if (pointers.size === 2) {
      previousDistance = getDistance();
    }
  }, true);

  document.addEventListener("pointermove", event => {
    if (!targetFound) return;
    if (!pointers.has(event.pointerId)) return;

    event.preventDefault();

    if (interactionMode === "paint") {
      movePaint(event.clientX, event.clientY);

      pointers.set(event.pointerId, {
        x: event.clientX,
        y: event.clientY
      });

      return;
    }

    pointers.set(event.pointerId, {
      x: event.clientX,
      y: event.clientY
    });

    if (pointers.size >= 2) {
      const newDistance = getDistance();

      if (previousDistance > 0 && newDistance > 0) {
        zoom += (newDistance - previousDistance) * 0.002;

        zoom = Math.max(
          MIN_ZOOM,
          Math.min(MAX_ZOOM, zoom)
        );

        updateModel();
      }

      previousDistance = newDistance;
      return;
    }

    const dx = event.clientX - previousX;
    const dy = event.clientY - previousY;

    previousX = event.clientX;
    previousY = event.clientY;

    rotY += dx * ROTATE_SPEED;
    rotX -= dy * ROTATE_SPEED;

    updateModel();
  }, { capture: true, passive: false });

  function releasePointer(event) {
    pointers.delete(event.pointerId);

    if (interactionMode === "paint") {
      stopActivePaint();
      return;
    }

    if (pointers.size === 1) {
      const point = [...pointers.values()][0];

      previousX = point.x;
      previousY = point.y;
    }

    previousDistance =
      pointers.size >= 2 ? getDistance() : 0;
  }

  document.addEventListener("pointerup", releasePointer, true);
  document.addEventListener("pointercancel", releasePointer, true);

  // -----------------------------
  // ปรับขนาดแปรงและความเข้ม
  // -----------------------------

  brushSizeInput.addEventListener("input", () => {
    brushValue.textContent = brushSizeInput.value;
  });

  burnSpeedInput.addEventListener("input", () => {
    speedValue.textContent = burnSpeedInput.value;
  });

  // -----------------------------
  // ล้างรอยไหม้ คืนภาพ Texture ต้นฉบับ
  // -----------------------------

  document.getElementById("clearBurns").addEventListener("click", () => {
    stopActivePaint();

    paintMaterials.forEach(data => {
      data.ctx.clearRect(0, 0, data.width, data.height);

      data.ctx.drawImage(
        data.backupCanvas,
        0, 0,
        data.width,
        data.height
      );

      data.texture.needsUpdate = true;
    });

    modelStatus.textContent = "ลบรอยไหม้ทั้งหมดแล้ว";
  });

  // -----------------------------
  // ปุ่มหมุนและซูม
  // -----------------------------

  document.querySelectorAll("[data-action]").forEach(button => {
    button.addEventListener("click", () => {
      if (!targetFound || interactionMode !== "rotate") return;

      const action = button.dataset.action;
      const step = 15;

      switch (action) {
        case "left": rotY -= step; break;
        case "right": rotY += step; break;
        case "up": rotX -= step; break;
        case "down": rotX += step; break;
        case "tiltLeft": rotZ -= step; break;
        case "tiltRight": rotZ += step; break;

        case "zoomIn":
          zoom = Math.min(MAX_ZOOM, zoom + 0.05);
          break;

        case "zoomOut":
          zoom = Math.max(MIN_ZOOM, zoom - 0.05);
          break;
      }

      updateModel();
    });
  });

  document.addEventListener("wheel", event => {
    if (!targetFound || interactionMode !== "rotate") return;
    if (event.target.closest("#controls")) return;

    event.preventDefault();

    zoom -= event.deltaY * 0.001;

    zoom = Math.max(
      MIN_ZOOM,
      Math.min(MAX_ZOOM, zoom)
    );

    updateModel();
  }, { passive: false });

  document.getElementById("resetBtn").addEventListener("click", resetModel);

  // -----------------------------
  // ปิดกล้อง
  // -----------------------------

  document.getElementById("stopBtn").addEventListener("click", async () => {
    try {
      const mindar = scene.systems["mindar-image-system"];

      if (mindar && cameraStarted) {
        await mindar.stop();
      }
    } catch (error) {
      console.error(error);
    }

    cameraStarted = false;
    targetFound = false;

    pointers.clear();
    stopActivePaint();
    resetModel();
    setMode("rotate");

    controls.style.display = "none";
    hint.style.display = "none";
    modelStatus.style.display = "none";

    startLayer.style.display = "grid";
    status.textContent =
      "ปิดกล้องแล้ว กดเริ่มสแกนเพื่อใช้งานอีกครั้ง";
  });

  updateModel();

})();
</script>

</body>
</html>
